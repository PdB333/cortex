name: Cortex Remote protocol and agent

on:
  push:
    branches: ["feat/formats-cortex-remote"]
  pull_request:
    paths:
      - "core/remote/**"
      - "agent/remote/**"
      - "tools/remote/**"
      - "cmake/**"
      - "tests/remote_*"
      - "tests/fuzz/fuzz_remote_protocol.cpp"
      - ".github/workflows/cortex-remote.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler, TLS provisioning tool and sanitizer runtimes
        run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev ninja-build openssl
      - name: Configure
        run: >-
          cmake -S tools/remote -B build/remote -G Ninja
          -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          -DCMAKE_BUILD_TYPE=Debug -DCORTEX_REMOTE_SANITIZERS=ON
          -DCORTEX_REMOTE_FUZZ=ON
      - name: Build
        run: cmake --build build/remote --parallel 2
      - name: Client against own agent and independent TLS peer
        run: ctest --test-dir build/remote --output-on-failure
      - name: Coverage-guided protocol fuzzing (no sockets)
        run: |
          mkdir -p build/remote-corpus build/remote-findings
          python3 - <<'PY'
          import json, pathlib, struct
          folder = pathlib.Path('build/remote-corpus')
          for index, action in enumerate(['info', 'processes', 'maps', 'read', 'write']):
              value = {'schema': 'cortex.remote.request.v1', 'session': 'a'*32, 'instance': 'b'*32, 'action': action, 'arguments': {}}
              body = json.dumps(value).encode()
              (folder / str(index)).write_bytes(struct.pack('!4sBBHII', b'CRTX', 1, 2, 0, 1, len(body)) + body)
          PY
          build/remote/fuzz_remote_protocol -max_total_time=60 -max_len=262160 -timeout=5 -rss_limit_mb=1024 -artifact_prefix=build/remote-findings/ build/remote-corpus
      - name: Keep logs, never credentials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cortex-remote-linux-logs
          path: |
            build/remote/Testing/Temporary/*.log
            build/remote-findings/
          if-no-files-found: ignore

  ps5-cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y clang-18 lld-18 llvm-18 ninja-build unzip
      - name: Fetch pinned open SDK (build dependency only)
        run: |
          mkdir -p build/sdk
          curl --fail --location --retry 2 https://github.com/ps5-payload-dev/sdk/releases/download/v0.45/ps5-payload-sdk.zip -o build/sdk.zip
          echo '5fac64093d0e3e69f2584ce7935f24f703f622d9681f1495c85b9f00d1291a2c  build/sdk.zip' | sha256sum --check
          unzip -q build/sdk.zip -d build/sdk
      - name: Cross-build the native agent (no fixture backend)
        run: |
          cmake -S tools/remote -B build/ps5 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/cmake/ps5-clang-toolchain.cmake" \
            -DCORTEX_PS5_SDK="$PWD/build/sdk/ps5-payload-sdk" \
            -DCORTEX_LLVM_BIN=/usr/lib/llvm-18/bin \
            -DCORTEX_REMOTE_PS5=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ps5 --target cortex-agent --parallel 2
          llvm-readelf-18 --file-header --dynamic build/ps5/cortex-agent.elf
      # A successful link is not a console test. Do not publish SDK-linked
      # binaries as releases here; source and dependency licences differ.

name: Fix Freeze E2E

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/fix-freeze-e2e.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/release-consolidation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/release-consolidation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make freeze scenario deterministic
        shell: python
        run: |
          from pathlib import Path

          path = Path("tests/e2e/run_e2e.ps1")
          text = path.read_text(encoding="utf-8")
          start_marker = '        $freeze = Request-Json POST "/freeze"'
          end_marker = '        Assert-That ([int]$afterFreeze.value -ne 4242) "Value did not resume after unfreeze"\n'
          start = text.find(start_marker)
          end_start = text.find(end_marker, start)
          if start < 0 or end_start < 0:
              raise SystemExit("freeze test block not found")
          end = end_start + len(end_marker)
          replacement = '''        $freeze = Request-Json POST "/freeze" @{ address = $fixture.Manifest.health; type = "u32"; value = 4242; label = "e2e-health" }
          Assert-That ($freeze.ok -and [int]$freeze.id -gt 0) "Freeze creation failed"
          Wait-For -TimeoutMs 2000 -PollMs 20 -Description "initial frozen value" -Condition {
              $sample = Request-Json POST "/memory/read" @{ address = $fixture.Manifest.health; type = "u32" }
              [int]$sample.value -eq 4242
          }
          1..3 | ForEach-Object {
              $perturbedValue = 5000 + $_
              $perturb = Request-Json POST "/memory/write" @{ address = $fixture.Manifest.health; type = "u32"; value = $perturbedValue }
              Assert-That $perturb.ok "Failed to perturb frozen value"
              Wait-For -TimeoutMs 2000 -PollMs 20 -Description "freeze restoration $($_)" -Condition {
                  $sample = Request-Json POST "/memory/read" @{ address = $fixture.Manifest.health; type = "u32" }
                  [int]$sample.value -eq 4242
              }
          }
          [void](Request-Json DELETE "/freeze/$($freeze.id)")
          $unfrozen = Request-Json POST "/memory/write" @{ address = $fixture.Manifest.health; type = "u32"; value = 7331 }
          Assert-That $unfrozen.ok "Failed to write after unfreeze"
          Start-Sleep -Milliseconds 100
          $afterFreeze = Request-Json POST "/memory/read" @{ address = $fixture.Manifest.health; type = "u32" }
          Assert-That ([int]$afterFreeze.value -ne 4242) "Value remained frozen after deletion"
  '''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          notes = changelog.read_text(encoding="utf-8")
          marker = "- Fixed private helper collisions in Cortex's combined injected translation unit.\n"
          addition = marker + "- Applied new freezes immediately and made the E2E freeze test verify bounded restoration after deliberate perturbations.\n"
          if addition not in notes:
              if marker not in notes:
                  raise SystemExit("changelog marker not found")
              notes = notes.replace(marker, addition, 1)
          changelog.write_text(notes, encoding="utf-8")

      - name: Commit deterministic test
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-freeze-e2e.yml
          git add -A
          git commit -m "Make freeze E2E deterministic"
          git push origin agent/release-consolidation

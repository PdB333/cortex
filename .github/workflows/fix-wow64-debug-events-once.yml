name: Fix WOW64 Debug Events Once

on:
  push:
    branches:
      - next/unified-cortex-ui
    paths:
      - ".github/workflows/fix-wow64-debug-events-once.yml"

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: next/unified-cortex-ui
          fetch-depth: 0

      - name: Handle WOW64 breakpoint and single-step events
        shell: pwsh
        run: |
          $path = "app/windows_debugger_backend.cpp"
          $content = [IO.File]::ReadAllText($path)

          $anchor = @'
#if defined(_WIN32)

struct WindowsDebuggerBackend::Impl {
'@
          $replacement = @'
#if defined(_WIN32)

namespace {
constexpr DWORD kStatusWx86SingleStep = 0x4000001Eu;
constexpr DWORD kStatusWx86Breakpoint = 0x4000001Fu;
}

struct WindowsDebuggerBackend::Impl {
'@
          $count = ([regex]::Matches($content, [regex]::Escape($anchor))).Count
          if ($count -ne 1) { throw "Expected one Windows Impl anchor, found $count" }
          $content = $content.Replace($anchor, $replacement)

          $oldBreakpoint = '        if (code == EXCEPTION_BREAKPOINT) {'
          $newBreakpoint = '        if (code == EXCEPTION_BREAKPOINT || (targetIsWow64X86() && code == kStatusWx86Breakpoint)) {'
          $count = ([regex]::Matches($content, [regex]::Escape($oldBreakpoint))).Count
          if ($count -ne 1) { throw "Expected one breakpoint dispatch, found $count" }
          $content = $content.Replace($oldBreakpoint, $newBreakpoint)

          $oldStep = '        if (code == EXCEPTION_SINGLE_STEP) {'
          $newStep = '        if (code == EXCEPTION_SINGLE_STEP || (targetIsWow64X86() && code == kStatusWx86SingleStep)) {'
          $count = ([regex]::Matches($content, [regex]::Escape($oldStep))).Count
          if ($count -ne 1) { throw "Expected one single-step dispatch, found $count" }
          $content = $content.Replace($oldStep, $newStep)

          [IO.File]::WriteAllText($path, $content, [Text.UTF8Encoding]::new($false))
          git diff --check
          git diff -- app/windows_debugger_backend.cpp

      - name: Commit fix and remove one-shot workflow
        shell: pwsh
        run: |
          git config user.name "Cortex Automation"
          git config user.email "actions@users.noreply.github.com"
          git rm -- .github/workflows/fix-wow64-debug-events-once.yml
          git add -- app/windows_debugger_backend.cpp
          git commit -m "handle WOW64 debugger step events"
          git push origin HEAD:next/unified-cortex-ui

      - name: Dispatch beta gates on fixed HEAD
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ui-preview.yml --ref next/unified-cortex-ui
          gh workflow run assaultcube-offline.yml --ref next/unified-cortex-ui
          gh workflow run linux-app.yml --ref next/unified-cortex-ui

name: Unified Cortex UI Preview

on:
  push:
    branches:
      - next/unified-cortex-ui
    paths:
      - "app/**"
      - "core/**"
      - "runtime_helper/**"
      - "CMakeLists.txt"
      - ".github/workflows/ui-preview.yml"
  workflow_dispatch:

concurrency:
  group: unified-cortex-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-x64-stage:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Verify runtime has no Dear ImGui dependency
        shell: pwsh
        run: |
          $matches = @(git grep -n -i "imgui" -- CMakeLists.txt core app/CMakeLists.txt 2>$null)
          $grepExit = $LASTEXITCODE
          if ($grepExit -eq 0 -and $matches.Count -gt 0) {
            $matches | Write-Host
            throw "Dear ImGui is still referenced by the runtime/build"
          }
          if ($grepExit -ne 0 -and $grepExit -ne 1) {
            throw "git grep failed while checking Dear ImGui references: $grepExit"
          }
          Write-Host "Dear ImGui runtime/build references: none"
          exit 0

      - name: Install x64 MinGW + Qt 6
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-tools

      - name: Configure Cortex application
        shell: msys2 {0}
        run: cmake -S app -B build/ui -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build cortex.exe
        shell: msys2 {0}
        run: cmake --build build/ui --parallel 2

      - name: Configure x64 target runtime
        shell: msys2 {0}
        run: >-
          cmake -S . -B build/runtime-x64 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF

      - name: Build x64 payload and E2E target
        shell: msys2 {0}
        run: cmake --build build/runtime-x64 --target core cortex_test_target --parallel 2

      - name: QML smoke test
        shell: msys2 {0}
        run: QT_QPA_PLATFORM=offscreen build/ui/cortex.exe --smoke-test

      - name: Stage x64 portable application
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rm -rf stage/x64
          mkdir -p stage/x64/CortexPreview/runtime/x64 stage/x64/e2e
          cp build/ui/cortex.exe stage/x64/CortexPreview/cortex.exe
          cp build/runtime-x64/cortex_core.dll stage/x64/CortexPreview/runtime/x64/cortex_core.dll
          cp build/runtime-x64/cortex_test_target_x64.exe stage/x64/e2e/cortex_test_target_x64.exe

          if command -v windeployqt6 >/dev/null 2>&1; then
            DEPLOY=windeployqt6
          else
            DEPLOY=windeployqt
          fi
          "$DEPLOY" --release --qmldir app/qml --no-translations stage/x64/CortexPreview/cortex.exe

          for pass in 1 2 3 4 5 6 7 8; do
            copied=0
            while IFS= read -r -d '' pe; do
              while IFS= read -r dep; do
                [ -n "$dep" ] || continue
                base="$(basename "$dep")"
                if [ ! -f "stage/x64/CortexPreview/$base" ]; then
                  cp "$dep" "stage/x64/CortexPreview/$base"
                  echo "Bundled x64 runtime dependency: $base"
                  copied=1
                fi
              done < <(ldd "$pe" 2>/dev/null | awk '/=> \/mingw64\/bin\// {print $3} /^\/mingw64\/bin\// {print $1}' | sort -u)
            done < <(find stage/x64/CortexPreview -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
            [ "$copied" -eq 1 ] || break
          done

      - name: Verify x64 dependency closure
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test -f stage/x64/CortexPreview/cortex.exe
          test -f stage/x64/CortexPreview/runtime/x64/cortex_core.dll
          test -f stage/x64/e2e/cortex_test_target_x64.exe
          missing=0
          while IFS= read -r -d '' pe; do
            unresolved="$(ldd "$pe" 2>/dev/null | awk '/not found/ {print}' || true)"
            if [ -n "$unresolved" ]; then
              echo "Unresolved dependencies for $pe:"
              echo "$unresolved"
              missing=1
            fi
          done < <(find stage/x64/CortexPreview -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
          [ "$missing" -eq 0 ]

      - name: Upload x64 staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: cortex-unified-x64-stage
          path: stage/x64
          if-no-files-found: error
          retention-days: 1

  windows-x86-stage:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install x86 MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja

      - name: Configure x86 target runtime
        shell: msys2 {0}
        run: >-
          cmake -S . -B build/runtime-x86 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF

      - name: Build x86 payload and E2E target
        shell: msys2 {0}
        run: cmake --build build/runtime-x86 --target core cortex_test_target --parallel 2

      - name: Build private x86 bootstrap helper
        shell: msys2 {0}
        run: >-
          c++ -std=c++17 -O2 -municode runtime_helper/main.cpp
          -o build/runtime-x86/cortex_runtime_helper.exe
          -static -static-libgcc -static-libstdc++

      - name: Stage and verify x86 runtime assets
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rm -rf stage/x86
          mkdir -p stage/x86/runtime/x86 stage/x86/e2e
          cp build/runtime-x86/cortex_core.dll stage/x86/runtime/x86/cortex_core.dll
          cp build/runtime-x86/cortex_runtime_helper.exe stage/x86/runtime/x86/cortex_runtime_helper.exe
          cp build/runtime-x86/cortex_test_target_x86.exe stage/x86/e2e/cortex_test_target_x86.exe

          test -f stage/x86/runtime/x86/cortex_core.dll
          test -f stage/x86/runtime/x86/cortex_runtime_helper.exe
          test -f stage/x86/e2e/cortex_test_target_x86.exe
          missing=0
          while IFS= read -r -d '' pe; do
            unresolved="$(ldd "$pe" 2>/dev/null | awk '/not found/ {print}' || true)"
            if [ -n "$unresolved" ]; then
              echo "Unresolved x86 dependencies for $pe:"
              echo "$unresolved"
              missing=1
            fi
          done < <(find stage/x86/runtime/x86 -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
          [ "$missing" -eq 0 ]

      - name: Upload x86 staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: cortex-unified-x86-stage
          path: stage/x86
          if-no-files-found: error
          retention-days: 1

  windows-portable-preview:
    needs: [windows-x64-stage, windows-x86-stage]
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout workflow history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download x64 staging bundle
        uses: actions/download-artifact@v4
        with:
          name: cortex-unified-x64-stage
          path: staging/x64

      - name: Download x86 staging bundle
        uses: actions/download-artifact@v4
        with:
          name: cortex-unified-x86-stage
          path: staging/x86

      - name: Assemble one Cortex application bundle
        shell: pwsh
        run: |
          $preview = (Resolve-Path "staging/x64/CortexPreview").Path
          $x86Runtime = (Resolve-Path "staging/x86/runtime/x86").Path
          $destination = Join-Path $preview "runtime\x86"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item (Join-Path $x86Runtime "*") $destination -Force

          @(
            "Cortex unified application preview",
            "Branch: next/unified-cortex-ui",
            "This is a test artifact, not a public release.",
            "Run cortex.exe for the desktop application.",
            "Run cortex.exe mcp for persistent MCP; --pid/--process remain startup auto-attach shortcuts.",
            "x64 and x86 target instrumentation are selected automatically.",
            "Files under runtime/ are private implementation assets, not separate Cortex products."
          ) | Set-Content -Encoding UTF8 (Join-Path $preview "TESTING.txt")

          foreach ($required in @(
            "cortex.exe",
            "runtime\x64\cortex_core.dll",
            "runtime\x86\cortex_core.dll",
            "runtime\x86\cortex_runtime_helper.exe"
          )) {
            if (-not (Test-Path (Join-Path $preview $required))) {
              throw "missing preview asset: $required"
            }
          }
          foreach ($notPublic in @("cortex_host.exe", "injector.exe", "cortex_mcp_bridge.exe", "cortex_runtime_helper.exe", "cortex_core.dll")) {
            if (Test-Path (Join-Path $preview $notPublic)) {
              throw "internal/legacy executable leaked into public bundle root: $notPublic"
            }
          }

      - name: Extract and validate full integrated MCP E2E
        shell: pwsh
        run: |
          $sourceBlob = "2c2dda411d49540c0b599d5c93cd96de9f76de7e"
          $rawLines = @(& git cat-file blob $sourceBlob)
          if ($LASTEXITCODE -ne 0 -or $rawLines.Count -lt 1000) {
            throw "could not load the full historical UI Preview E2E source blob"
          }
          $text = ($rawLines -join "`n") + "`n"

          $bad = '$trackEvents = @{ jsonrpc="2.0"; id=404; method="tools/call"; params=@{ name="re_object_events"; arguments=@{ _path=@{ id=$trackId } } } | ConvertTo-Json -Depth 8 -Compress'
          $good = '$trackEvents = @{ jsonrpc="2.0"; id=404; method="tools/call"; params=@{ name="re_object_events"; arguments=@{ _path=@{ id=$trackId } } } } | ConvertTo-Json -Depth 8 -Compress'
          $badCount = ([regex]::Matches($text, [regex]::Escape($bad))).Count
          if ($badCount -ne 1) { throw "expected exactly one historical E2E repair target, found $badCount" }
          $text = $text.Replace($bad, $good)

          $startMarker = '      - name: Integrated MCP E2E on x64 and x86 targets'
          $endMarker = '      - name: Portable GUI smoke test with clean PATH'
          $start = $text.IndexOf($startMarker)
          $end = $text.IndexOf($endMarker, $start)
          if ($start -lt 0 -or $end -le $start) { throw "integrated MCP E2E markers missing" }
          $chunk = $text.Substring($start, $end - $start)
          $runMarker = "        run: |`n"
          $run = $chunk.IndexOf($runMarker)
          if ($run -lt 0) { throw "integrated MCP E2E run block missing" }
          $body = $chunk.Substring($run + $runMarker.Length)
          $scriptLines = $body -split "`n"
          $script = ($scriptLines | ForEach-Object {
            if ($_.StartsWith('          ')) { $_.Substring(10) }
            elseif ([string]::IsNullOrEmpty($_)) { '' }
            else { throw "unexpected E2E block indentation: $_" }
          }) -join "`n"

          $scriptPath = Join-Path $env:RUNNER_TEMP "cortex-integrated-mcp-e2e.ps1"
          [IO.File]::WriteAllText($scriptPath, $script, [Text.UTF8Encoding]::new($false))
          $scriptSha = (Get-FileHash $scriptPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedSha = "8b018b8e847216101f3bbaf38b77185b7a1aea5d4bb22efd75b6b95f534357aa"
          if ($scriptSha -ne $expectedSha) {
            throw "extracted E2E script differs from locally validated source: $scriptSha"
          }
          foreach ($requiredProbe in @('debug_pause','debug_step_over','Test-CortexMcpMultiTarget $x64Target $x86Target')) {
            if (-not $script.Contains($requiredProbe)) { throw "missing required E2E probe: $requiredProbe" }
          }

          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($scriptPath, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Host $_.Message }
            throw "integrated MCP E2E PowerShell does not parse"
          }
          Write-Host "validated full integrated MCP E2E: $scriptSha"

      - name: Integrated MCP E2E on x64, x86 and mixed-bitness targets
        shell: pwsh
        run: pwsh -NoProfile -File "$env:RUNNER_TEMP/cortex-integrated-mcp-e2e.ps1"

      - name: Dynamic targetless MCP attach and detach E2E
        shell: pwsh
        run: |
          $preview = (Resolve-Path "staging/x64/CortexPreview").Path
          $x64TargetPath = (Resolve-Path "staging/x64/e2e/cortex_test_target_x64.exe").Path
          $x86TargetPath = (Resolve-Path "staging/x86/e2e/cortex_test_target_x86.exe").Path
          $targetA = $null
          $targetB = $null
          $mcp = $null

          function Read-CortexMcpResponse([System.IO.StreamReader]$reader, [int]$expectedId, [int]$timeoutMs = 20000) {
            $deadline = [DateTime]::UtcNow.AddMilliseconds($timeoutMs)
            while ([DateTime]::UtcNow -lt $deadline) {
              $remaining = [Math]::Max(1, [int]($deadline - [DateTime]::UtcNow).TotalMilliseconds)
              $pending = $reader.ReadLineAsync()
              if (-not $pending.Wait($remaining)) { throw "Timed out waiting for MCP response id=$expectedId" }
              $line = $pending.Result
              if ($null -eq $line) { throw "Cortex MCP stdout closed while waiting for id=$expectedId" }
              if ([string]::IsNullOrWhiteSpace($line)) { continue }
              $message = $line | ConvertFrom-Json
              if ($null -ne $message.id -and [int]$message.id -eq $expectedId) { return $message }
              if ([string]$message.method -eq "notifications/tools/list_changed") {
                Write-Host "Observed dynamic MCP tools/list_changed"
                continue
              }
              Write-Host ("Ignoring interleaved MCP message while waiting for id={0}: {1}" -f $expectedId, $line)
            }
            throw "Timed out waiting for MCP response id=$expectedId"
          }

          function Send-CortexMcp([System.Diagnostics.Process]$process, [hashtable]$request, [int]$timeoutMs = 20000) {
            $id = [int]$request.id
            $json = $request | ConvertTo-Json -Depth 12 -Compress
            $process.StandardInput.WriteLine($json)
            $process.StandardInput.Flush()
            return Read-CortexMcpResponse $process.StandardOutput $id $timeoutMs
          }

          try {
            $manifestA = Join-Path $env:RUNNER_TEMP "cortex-dynamic-a.json"
            $manifestB = Join-Path $env:RUNNER_TEMP "cortex-dynamic-b.json"
            Remove-Item $manifestA,$manifestB -Force -ErrorAction SilentlyContinue
            $targetA = Start-Process -FilePath $x64TargetPath -ArgumentList @("--e2e-manifest", $manifestA) -PassThru
            $targetB = Start-Process -FilePath $x86TargetPath -ArgumentList @("--e2e-manifest", $manifestB) -PassThru
            for ($attempt = 0; $attempt -lt 80 -and (-not (Test-Path $manifestA) -or -not (Test-Path $manifestB)); $attempt++) {
              Start-Sleep -Milliseconds 100
            }
            if (-not (Test-Path $manifestA) -or -not (Test-Path $manifestB)) { throw "dynamic MCP fixtures did not initialize" }

            $start = [System.Diagnostics.ProcessStartInfo]::new()
            $start.FileName = Join-Path $preview "cortex.exe"
            $start.Arguments = "mcp --tools all"
            $start.WorkingDirectory = $preview
            $start.UseShellExecute = $false
            $start.RedirectStandardInput = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.CreateNoWindow = $true
            $mcp = [System.Diagnostics.Process]::new()
            $mcp.StartInfo = $start
            if (-not $mcp.Start()) { throw "failed to start targetless Cortex MCP" }

            $init = Send-CortexMcp $mcp @{ jsonrpc="2.0"; id=1; method="initialize"; params=@{ protocolVersion="2025-11-25"; capabilities=@{}; clientInfo=@{ name="dynamic-preview-ci"; version="1" } } }
            if ($init.result.protocolVersion -ne "2025-11-25" -or -not $init.result.capabilities.tools.listChanged) {
              throw "targetless Cortex MCP did not advertise dynamic tool-list changes"
            }
            $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","method":"notifications/initialized"}')
            $mcp.StandardInput.Flush()

            $before = Send-CortexMcp $mcp @{ jsonrpc="2.0"; id=2; method="tools/list"; params=@{} }
            $beforeNames = @($before.result.tools | ForEach-Object { [string]$_.name })
            foreach ($required in @("cortex_processes","cortex_attach","cortex_detach","cortex_targets")) {
              if ($beforeNames -notcontains $required) { throw "targetless MCP missing host tool: $required" }
            }
            if ($beforeNames -contains "status") { throw "targetless MCP unexpectedly exposed a target runtime catalog" }

            $processes = Send-CortexMcp $mcp @{ jsonrpc="2.0"; id=3; method="tools/call"; params=@{ name="cortex_processes"; arguments=@{ query="cortex_test_target"; limit=32 } } }
            $visiblePids = @($processes.result.structuredContent.processes | ForEach-Object { [int64]$_.pid })
            if ($visiblePids -notcontains [int64]$targetA.Id -or $visiblePids -notcontains [int64]$targetB.Id) {
              throw "cortex_processes did not discover both live fixtures"
            }

            $attachA = Send-CortexMcp $mcp @{ jsonrpc="2.0"; id=4; method="tools/call"; params=@{ name="cortex_attach"; arguments=@{ pid=[int64]$targetA.Id } } } 30000
            if (-not $attachA.result.structuredContent.ok -or [int64]$attachA.result.structuredContent.target.pid -ne [int64]$targetA.Id) {
              throw "dynamic x64 attach failed"
            }

            $oneTargetTools = Send-CortexMcp $mcp @{ jsonrpc="2.0"; id=5; method="tools/list"; params=@{} }
            if (@($oneTargetTools.result.tools.name) -notcontains "status") { throw "runtime tools did not appear after dynamic attach" }
            $statusA = Send-CortexMcp $mcp @{ jsonrpc="2.0"; id=6; method="tools/call"; params=@{ name="status"; arguments=@{} } }
            if ([int64]$statusA.result.structuredContent.result.pid -ne [int64]$targetA.Id) { throw "single dynamic target routing failed" }

            $attachB = Send-CortexMcp $mcp @{ jsonrpc="2.0"; id=7; method="tools/call"; params=@{ name="cortex_attach"; arguments=@{ pid=[int64]$targetB.Id } } } 30000
            if (-not $attachB.result.structuredContent.ok -or [int64]$attachB.result.structuredContent.target.pid -ne [int64]$targetB.Id) {
              throw "dynamic x86 attach failed"
            }

            $twoTargetTools = Send-CortexMcp $mcp @{ jsonrpc="2.0"; id=8; method="tools/list"; params=@{} }
            $statusTool = @($twoTargetTools.result.tools | Where-Object { $_.name -eq "status" } | Select-Object -First 1)
            $detachTool = @($twoTargetTools.result.tools | Where-Object { $_.name -eq "cortex_detach" } | Select-Object -First 1)
            if ($statusTool.Count -ne 1 -or @($statusTool[0].inputSchema.required) -notcontains "_cortex_target" -or
                $detachTool.Count -ne 1 -or @($detachTool[0].inputSchema.required) -notcontains "_cortex_target") {
              throw "dynamic multi-target catalog did not require _cortex_target"
            }

            $statusA2 = Send-CortexMcp $mcp @{ jsonrpc="2.0"; id=9; method="tools/call"; params=@{ name="status"; arguments=@{ _cortex_target=[int64]$targetA.Id } } }
            $statusB = Send-CortexMcp $mcp @{ jsonrpc="2.0"; id=10; method="tools/call"; params=@{ name="status"; arguments=@{ _cortex_target=[int64]$targetB.Id } } }
            if ([int64]$statusA2.result.structuredContent.result.pid -ne [int64]$targetA.Id -or
                [int64]$statusB.result.structuredContent.result.pid -ne [int64]$targetB.Id) {
              throw "dynamic mixed-bitness target routing failed"
            }

            $detachA = Send-CortexMcp $mcp @{ jsonrpc="2.0"; id=11; method="tools/call"; params=@{ name="cortex_detach"; arguments=@{ _cortex_target=[int64]$targetA.Id } } }
            if (-not $detachA.result.structuredContent.ok -or [int]$detachA.result.structuredContent.count -ne 1) { throw "dynamic x64 detach failed" }
            $statusRemaining = Send-CortexMcp $mcp @{ jsonrpc="2.0"; id=12; method="tools/call"; params=@{ name="status"; arguments=@{} } }
            if ([int64]$statusRemaining.result.structuredContent.result.pid -ne [int64]$targetB.Id) { throw "remaining dynamic target did not become implicit" }

            $detachB = Send-CortexMcp $mcp @{ jsonrpc="2.0"; id=13; method="tools/call"; params=@{ name="cortex_detach"; arguments=@{} } }
            if (-not $detachB.result.structuredContent.ok -or [int]$detachB.result.structuredContent.count -ne 0) { throw "dynamic x86 detach failed" }
            $targets = Send-CortexMcp $mcp @{ jsonrpc="2.0"; id=14; method="tools/call"; params=@{ name="cortex_targets"; arguments=@{} } }
            if ([int]$targets.result.structuredContent.count -ne 0) { throw "targetless state was not restored after detach" }

            $after = Send-CortexMcp $mcp @{ jsonrpc="2.0"; id=15; method="tools/list"; params=@{} }
            $afterNames = @($after.result.tools | ForEach-Object { [string]$_.name })
            if ($afterNames -notcontains "cortex_attach" -or $afterNames -contains "status") { throw "targetless host catalog was not restored" }

            $targetA.Refresh(); $targetB.Refresh()
            if ($targetA.HasExited -or $targetB.HasExited) { throw "dynamic MCP attach/detach crashed an E2E target" }
            Write-Host "PASS: one targetless MCP connection dynamically attached, routed and detached x64+x86 targets"
          } finally {
            if ($mcp) {
              try { $mcp.StandardInput.Close() } catch {}
              if (-not $mcp.HasExited) { Stop-Process -Id $mcp.Id -Force -ErrorAction SilentlyContinue }
              $mcp.Dispose()
            }
            foreach ($target in @($targetA,$targetB)) {
              if ($target) {
                try { $target.Refresh() } catch {}
                if (-not $target.HasExited) { Stop-Process -Id $target.Id -Force -ErrorAction SilentlyContinue }
                $target.Dispose()
              }
            }
          }

      - name: Portable GUI smoke test with clean PATH
        shell: pwsh
        run: |
          $preview = (Resolve-Path "staging/x64/CortexPreview").Path
          $oldPath = $env:PATH
          $stdout = Join-Path $env:RUNNER_TEMP "cortex-portable-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "cortex-portable-stderr.txt"
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
            $process = Start-Process `
              -FilePath (Join-Path $preview "cortex.exe") `
              -ArgumentList "--smoke-test" `
              -WorkingDirectory $preview `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -PassThru

            if (-not $process.WaitForExit(15000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Portable Cortex GUI smoke test timed out"
            }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            $startupLog = Join-Path $preview "cortex-smoke.log"
            if (Test-Path $startupLog) { Get-Content $startupLog }
            if ($process.ExitCode -ne 0) {
              throw "Portable Cortex GUI smoke test failed with exit code $($process.ExitCode)"
            }
          } finally {
            $env:PATH = $oldPath
          }

      - name: Upload testable application
        uses: actions/upload-artifact@v4
        with:
          name: cortex-unified-ui-preview-windows
          path: staging/x64/CortexPreview
          if-no-files-found: error
          retention-days: 14

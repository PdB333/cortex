name: Publish Release

on:
  push:
    branches:
      - main
    paths:
      - "app_imgui/**"
      - "resources/windows/**"
      - "installer/**"
      - "core/**"
      - "mcp_bridge/**"
      - "runtime_helper/**"
      - "host/**"
      - "injector/**"
      - "tools/**"
      - "docs/**"
      - "CMakeLists.txt"
      - "README.md"
      - "README_INSTALL.txt"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".github/workflows/publish-release.yml"
  pull_request:
    paths:
      - "app_imgui/**"
      - "resources/windows/**"
      - "installer/**"
      - "core/**"
      - "mcp_bridge/**"
      - "runtime_helper/**"
      - "host/**"
      - "injector/**"
      - "tools/**"
      - "docs/**"
      - "CMakeLists.txt"
      - "README.md"
      - "README_INSTALL.txt"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v2.1.0-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RELEASE_TAG: v2.1.0

jobs:
  windows-x64-stage:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Release v2.1.0')
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Install x64 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Build and smoke Dear ImGui application
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S app_imgui -B build/ui -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ui --parallel 2
          build/ui/cortex.exe --smoke-test
          build/ui/cortex.exe --window-smoke-test

      - name: Build and test x64 runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build/runtime-x64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/runtime-x64 --parallel 2
          ctest --test-dir build/runtime-x64 --output-on-failure

      - name: Stage portable x64 application
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rm -rf stage/x64
          mkdir -p stage/x64/Cortex/runtime/x64
          cp build/ui/cortex.exe stage/x64/Cortex/cortex.exe
          cp build/runtime-x64/cortex_core.dll stage/x64/Cortex/runtime/x64/cortex_core.dll

          for pass in 1 2 3 4 5 6 7 8; do
            copied=0
            while IFS= read -r -d '' pe; do
              while IFS= read -r dep; do
                [ -n "$dep" ] || continue
                base="$(basename "$dep")"
                if [ ! -f "stage/x64/Cortex/$base" ]; then
                  cp "$dep" "stage/x64/Cortex/$base"
                  echo "Bundled dependency: $base"
                  copied=1
                fi
              done < <(ldd "$pe" 2>/dev/null | awk '/=> \/mingw64\/bin\// {print $3} /^\/mingw64\/bin\// {print $1}' | sort -u)
            done < <(find stage/x64/Cortex -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
            [ "$copied" -eq 1 ] || break
          done

          missing=0
          while IFS= read -r -d '' pe; do
            unresolved="$(ldd "$pe" 2>/dev/null | awk '/not found/ {print}' || true)"
            if [ -n "$unresolved" ]; then
              echo "Unresolved dependencies for $pe:"
              echo "$unresolved"
              missing=1
            fi
          done < <(find stage/x64/Cortex -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
          [ "$missing" -eq 0 ]

      - name: Upload x64 stage
        uses: actions/upload-artifact@v4
        with:
          name: cortex-release-x64-stage
          path: stage/x64
          if-no-files-found: error
          retention-days: 2

  windows-x86-stage:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Release v2.1.0')
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install x86 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja

      - name: Build and test x86 runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build/runtime-x86 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/runtime-x86 --parallel 2
          ctest --test-dir build/runtime-x86 --output-on-failure

      - name: Build private x86 bootstrap helper
        shell: msys2 {0}
        run: >-
          c++ -std=c++17 -O2 -municode runtime_helper/main.cpp
          -o build/runtime-x86/cortex_runtime_helper.exe
          -static -static-libgcc -static-libstdc++

      - name: Stage x86 runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rm -rf stage/x86
          mkdir -p stage/x86/runtime/x86
          cp build/runtime-x86/cortex_core.dll stage/x86/runtime/x86/cortex_core.dll
          cp build/runtime-x86/cortex_runtime_helper.exe stage/x86/runtime/x86/cortex_runtime_helper.exe

      - name: Upload x86 stage
        uses: actions/upload-artifact@v4
        with:
          name: cortex-release-x86-stage
          path: stage/x86
          if-no-files-found: error
          retention-days: 2

  package:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Release v2.1.0')
    needs: [windows-x64-stage, windows-x86-stage]
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download x64 stage
        uses: actions/download-artifact@v4
        with:
          name: cortex-release-x64-stage
          path: staging/x64

      - name: Download x86 stage
        uses: actions/download-artifact@v4
        with:
          name: cortex-release-x86-stage
          path: staging/x86

      - name: Assemble and validate release archive
        shell: pwsh
        run: |
          $bundle = (Resolve-Path "staging/x64/Cortex").Path
          New-Item -ItemType Directory -Force -Path (Join-Path $bundle "runtime\x86") | Out-Null
          Copy-Item "staging/x86/runtime/x86/*" (Join-Path $bundle "runtime\x86") -Force
          Copy-Item README.md, README_INSTALL.txt, CHANGELOG.md, LICENSE, CONTRIBUTING.md, SECURITY.md $bundle
          Copy-Item -Recurse docs (Join-Path $bundle "docs")
          Copy-Item -Recurse agent (Join-Path $bundle "agent")

          foreach ($required in @(
            "cortex.exe",
            "runtime\x64\cortex_core.dll",
            "runtime\x86\cortex_core.dll",
            "runtime\x86\cortex_runtime_helper.exe",
            "README.md",
            "README_INSTALL.txt",
            "CHANGELOG.md",
            "LICENSE"
          )) {
            $path = Join-Path $bundle $required
            if (-not (Test-Path $path)) { throw "missing release asset: $required" }
            if ((Get-Item $path).Length -eq 0) { throw "empty release asset: $required" }
          }
          if (Test-Path (Join-Path $bundle "cortex_core.dll")) { throw "cortex_core.dll must not be at the bundle root" }

          # Cortex 2.0 contents: the documents users need, README links that
          # resolve inside the archive, and nothing left over from tests.
          foreach ($required in @("docs\limitations.md", "docs\analysis-providers.md", "docs\third-party.md",
                                  "docs\getting-started.md", "docs\mcp.md", "docs\images\brand\cortex-banner-dark.png",
                                  "docs\images\brand\cortex-banner-light.png", "docs\images\readme\manual-find-what-writes.gif")) {
            if (-not (Test-Path (Join-Path $bundle $required))) { throw "missing release document: $required" }
          }
          $readme = Get-Content (Join-Path $bundle "README.md") -Raw
          $links = [regex]::Matches($readme, '(?:\]\(|src=")([^)"#\s]+)') | ForEach-Object { $_.Groups[1].Value } |
                   Where-Object { $_ -notmatch '^(https?:|mailto:)' } | Sort-Object -Unique
          $broken = @($links | Where-Object { -not (Test-Path (Join-Path $bundle $_)) })
          if ($broken.Count -gt 0) { throw "README links missing from the archive: $($broken -join ', ')" }
          Write-Host ("README links checked: {0}" -f $links.Count)
          if ((Get-Content (Join-Path $bundle "README_INSTALL.txt") -Raw) -notmatch "v2\.1\.0") {
            throw "README_INSTALL.txt does not name v2.1.0"
          }
          $leftovers = @(Get-ChildItem -Recurse -Force $bundle | Where-Object {
            $_.Name -like "cortex.mcp.*.token" -or $_.Name -eq "cortex_crashes" -or $_.Name -eq "cortex_sessions" -or
            $_.Name -like "cortex_test_target*" -or $_.Name -eq "e2e" })
          if ($leftovers.Count -gt 0) { throw "test leftovers in the archive: $($leftovers.FullName -join ', ')" }

          $versionStart = [System.Diagnostics.ProcessStartInfo]::new()
          $versionStart.FileName = Join-Path $bundle "cortex.exe"
          [void]$versionStart.ArgumentList.Add("--version")
          $versionStart.UseShellExecute = $false
          $versionStart.RedirectStandardOutput = $true
          $versionStart.RedirectStandardError = $true
          $versionStart.CreateNoWindow = $true
          $versionProcess = [System.Diagnostics.Process]::Start($versionStart)
          $versionText = $versionProcess.StandardOutput.ReadToEnd()
          $versionError = $versionProcess.StandardError.ReadToEnd()
          $versionProcess.WaitForExit()
          Write-Host ("release version output: {0}" -f $versionText.Trim())
          if ($versionProcess.ExitCode -ne 0 -or $versionText -notmatch "2\.1\.0") {
            throw "release binary does not report v2.1.0 (exit=$($versionProcess.ExitCode), stderr=$versionError)"
          }

          $help = & (Join-Path $bundle "cortex.exe") --help 2>&1 | Out-String
          foreach ($command in @("mcp", "inspect", "provider", "live", "evidence", "investigation", "setup", "update")) {
            if ($help -notmatch "cortex $command") { throw "--help does not list '$command'" }
          }
          $providers = & (Join-Path $bundle "cortex.exe") provider list 2>&1 | Out-String
          if ($LASTEXITCODE -ne 0) { throw "provider list failed without engines installed: $providers" }
          Write-Host $providers

          $oldPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            foreach ($argument in @("--smoke-test", "--window-smoke-test")) {
              $start = [System.Diagnostics.ProcessStartInfo]::new()
              $start.FileName = Join-Path $bundle "cortex.exe"
              [void]$start.ArgumentList.Add($argument)
              $start.UseShellExecute = $false
              $start.RedirectStandardOutput = $true
              $start.RedirectStandardError = $true
              $start.CreateNoWindow = $true
              $process = [System.Diagnostics.Process]::Start($start)
              $stdout = $process.StandardOutput.ReadToEnd()
              $stderr = $process.StandardError.ReadToEnd()
              if (-not $process.WaitForExit(15000)) {
                $process.Kill()
                throw "portable $argument timed out"
              }
              if ($process.ExitCode -ne 0) {
                throw "portable $argument failed ($($process.ExitCode)): $stderr"
              }
              Write-Host $stdout
            }
          } finally {
            $env:PATH = $oldPath
          }

          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$bundle/*" -DestinationPath "dist/cortex-v2.1.0-windows-portable.zip" -CompressionLevel Optimal

      # The installer is built from the validated bundle, then installed,
      # run and uninstalled silently on this runner.
      - name: Build and validate the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y | Out-Host }
          if (-not (Test-Path $iscc)) { throw "Inno Setup (ISCC.exe) is not available" }
          $bundle = (Resolve-Path "staging/x64/Cortex").Path
          $dist = (Resolve-Path "dist").Path
          & $iscc /Q "/DAppVersion=2.1.0" "/DSourceDir=$bundle" "/DOutputDir=$dist" "installer\cortex.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          $setup = Join-Path $dist "cortex-v2.1.0-windows-setup.exe"
          if (-not (Test-Path $setup)) { throw "the installer was not produced" }

          $dir = Join-Path $env:RUNNER_TEMP "cortex-installed"
          $install = Start-Process $setup -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$dir`"", "/TASKS=openwith") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "silent install failed ($($install.ExitCode))" }
          foreach ($required in @("cortex.exe", "unins000.exe", "runtime\x64\cortex_core.dll", "runtime\x86\cortex_core.dll",
                                  "runtime\x86\cortex_runtime_helper.exe", "docs\getting-started.md", "LICENSE")) {
            if (-not (Test-Path (Join-Path $dir $required))) { throw "installed copy misses $required" }
          }
          if (Test-Path (Join-Path $dir "cortex.portable")) { throw "the installed copy must not be portable" }
          if (-not (Test-Path "HKCU:\Software\Classes\SystemFileAssociations\.dll\shell\Cortex\command")) {
            throw "the Analyze with Cortex entry was not registered"
          }
          $start = [System.Diagnostics.ProcessStartInfo]::new()
          $start.FileName = Join-Path $dir "cortex.exe"
          foreach ($argument in @("update", "--check", "--json", "--feed", (Join-Path $dir "missing-feed.json"))) { [void]$start.ArgumentList.Add($argument) }
          $start.UseShellExecute = $false
          $start.RedirectStandardOutput = $true
          $start.CreateNoWindow = $true
          $process = [System.Diagnostics.Process]::Start($start)
          $report = $process.StandardOutput.ReadToEnd() | ConvertFrom-Json
          $process.WaitForExit()
          if ($report.install -ne "installed" -or $report.current -ne "2.1.0") { throw "the installed copy reports $($report | ConvertTo-Json -Compress)" }
          Write-Host "installed copy: $($report.install) $($report.current)"

          $uninstall = Start-Process (Join-Path $dir "unins000.exe") -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "silent uninstall failed ($($uninstall.ExitCode))" }
          for ($i = 0; $i -lt 60 -and (Test-Path (Join-Path $dir "cortex.exe")); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path (Join-Path $dir "cortex.exe")) { throw "the uninstaller left cortex.exe" }
          if (Test-Path "HKCU:\Software\Classes\SystemFileAssociations\.dll\shell\Cortex") { throw "the uninstaller left the right-click entry" }

          # Checksums the updater verifies before installing anything.
          $sums = foreach ($file in @("cortex-v2.1.0-windows-portable.zip", "cortex-v2.1.0-windows-setup.exe")) {
            "{0}  {1}" -f (Get-FileHash (Join-Path $dist $file) -Algorithm SHA256).Hash.ToLowerInvariant(), $file
          }
          Set-Content -Path (Join-Path $dist "SHA256SUMS.txt") -Value $sums -Encoding ascii
          Get-Content (Join-Path $dist "SHA256SUMS.txt")

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: cortex-v2.1.0-windows-portable
          path: |
            dist/cortex-v2.1.0-windows-portable.zip
            dist/cortex-v2.1.0-windows-setup.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Release v2.1.0')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          awk '/^## \[v2.1.0\]/{found=1; next} /^## \[/{if(found) exit} found' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: cortex-v2.1.0-windows-portable
          path: dist

      - name: Check the release files
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          ls -la
          sha256sum -c SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            dist/cortex-v2.1.0-windows-portable.zip \
            dist/cortex-v2.1.0-windows-setup.exe \
            dist/SHA256SUMS.txt

name: Publish Release

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "core/**"
      - "runtime_helper/**"
      - "docs/**"
      - "CMakeLists.txt"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".github/workflows/publish-release.yml"
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "runtime_helper/**"
      - "docs/**"
      - "CMakeLists.txt"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - ".github/workflows/publish-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v0.7.0-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.7.0

jobs:
  windows-x64-stage:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release v0.7.0')
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install x64 MinGW and Qt 6
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-tools

      - name: Build unified application
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S app -B build/ui -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ui --parallel 2
          QT_QPA_PLATFORM=offscreen build/ui/cortex.exe --smoke-test

      - name: Build and test x64 runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build/runtime-x64 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/runtime-x64 --parallel 2
          ctest --test-dir build/runtime-x64 --output-on-failure

      - name: Stage portable x64 application
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rm -rf stage/x64
          mkdir -p stage/x64/Cortex/runtime/x64
          cp build/ui/cortex.exe stage/x64/Cortex/cortex.exe
          cp build/runtime-x64/cortex_core.dll stage/x64/Cortex/runtime/x64/cortex_core.dll

          if command -v windeployqt6 >/dev/null 2>&1; then
            DEPLOY=windeployqt6
          else
            DEPLOY=windeployqt
          fi
          "$DEPLOY" --release --qmldir app/qml --no-translations stage/x64/Cortex/cortex.exe

          for pass in 1 2 3 4 5 6 7 8; do
            copied=0
            while IFS= read -r -d '' pe; do
              while IFS= read -r dep; do
                [ -n "$dep" ] || continue
                base="$(basename "$dep")"
                if [ ! -f "stage/x64/Cortex/$base" ]; then
                  cp "$dep" "stage/x64/Cortex/$base"
                  copied=1
                fi
              done < <(ldd "$pe" 2>/dev/null | awk '/=> \/mingw64\/bin\// {print $3} /^\/mingw64\/bin\// {print $1}' | sort -u)
            done < <(find stage/x64/Cortex -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
            [ "$copied" -eq 1 ] || break
          done

          missing=0
          while IFS= read -r -d '' pe; do
            unresolved="$(ldd "$pe" 2>/dev/null | awk '/not found/ {print}' || true)"
            if [ -n "$unresolved" ]; then
              echo "Unresolved dependencies for $pe:"
              echo "$unresolved"
              missing=1
            fi
          done < <(find stage/x64/Cortex -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
          [ "$missing" -eq 0 ]

      - name: Upload x64 stage
        uses: actions/upload-artifact@v4
        with:
          name: cortex-release-x64-stage
          path: stage/x64
          if-no-files-found: error
          retention-days: 2

  windows-x86-stage:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release v0.7.0')
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install x86 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja

      - name: Build and test x86 runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          cmake -S . -B build/runtime-x86 -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/runtime-x86 --parallel 2
          ctest --test-dir build/runtime-x86 --output-on-failure

      - name: Build private x86 bootstrap helper
        shell: msys2 {0}
        run: >-
          c++ -std=c++17 -O2 -municode runtime_helper/main.cpp
          -o build/runtime-x86/cortex_runtime_helper.exe
          -static -static-libgcc -static-libstdc++

      - name: Stage x86 runtime
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rm -rf stage/x86
          mkdir -p stage/x86/runtime/x86
          cp build/runtime-x86/cortex_core.dll stage/x86/runtime/x86/cortex_core.dll
          cp build/runtime-x86/cortex_runtime_helper.exe stage/x86/runtime/x86/cortex_runtime_helper.exe

      - name: Upload x86 stage
        uses: actions/upload-artifact@v4
        with:
          name: cortex-release-x86-stage
          path: stage/x86
          if-no-files-found: error
          retention-days: 2

  package:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release v0.7.0')
    needs: [windows-x64-stage, windows-x86-stage]
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download x64 stage
        uses: actions/download-artifact@v4
        with:
          name: cortex-release-x64-stage
          path: staging/x64

      - name: Download x86 stage
        uses: actions/download-artifact@v4
        with:
          name: cortex-release-x86-stage
          path: staging/x86

      - name: Assemble and validate release archive
        shell: pwsh
        run: |
          $bundle = (Resolve-Path "staging/x64/Cortex").Path
          New-Item -ItemType Directory -Force -Path (Join-Path $bundle "runtime\x86") | Out-Null
          Copy-Item "staging/x86/runtime/x86/*" (Join-Path $bundle "runtime\x86") -Force
          Copy-Item README.md, CHANGELOG.md, LICENSE $bundle
          Copy-Item -Recurse docs (Join-Path $bundle "docs")

          foreach ($required in @(
            "cortex.exe",
            "runtime\x64\cortex_core.dll",
            "runtime\x86\cortex_core.dll",
            "runtime\x86\cortex_runtime_helper.exe",
            "README.md",
            "CHANGELOG.md",
            "LICENSE"
          )) {
            $path = Join-Path $bundle $required
            if (-not (Test-Path $path)) { throw "missing release asset: $required" }
            if ((Get-Item $path).Length -eq 0) { throw "empty release asset: $required" }
          }

          $versionStart = [System.Diagnostics.ProcessStartInfo]::new()
          $versionStart.FileName = Join-Path $bundle "cortex.exe"
          $versionStart.ArgumentList.Add("--version")
          $versionStart.UseShellExecute = $false
          $versionStart.RedirectStandardOutput = $true
          $versionStart.RedirectStandardError = $true
          $versionStart.CreateNoWindow = $true
          $versionProcess = [System.Diagnostics.Process]::Start($versionStart)
          $versionText = $versionProcess.StandardOutput.ReadToEnd()
          $versionError = $versionProcess.StandardError.ReadToEnd()
          $versionProcess.WaitForExit()
          Write-Host ("release version output: {0}" -f $versionText.Trim())
          if ($versionProcess.ExitCode -ne 0 -or $versionText -notmatch "0\.7\.0") {
            throw "release binary does not report v0.7.0 (exit=$($versionProcess.ExitCode), stderr=$versionError)"
          }

          $oldPath = $env:PATH
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            & (Join-Path $bundle "cortex.exe") --smoke-test
            if ($LASTEXITCODE -ne 0) { throw "portable GUI smoke test failed" }
          } finally {
            $env:PATH = $oldPath
          }

          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$bundle/*" -DestinationPath "dist/cortex-v0.7.0-windows-portable.zip" -CompressionLevel Optimal

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: cortex-v0.7.0-windows-portable
          path: dist/cortex-v0.7.0-windows-portable.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v0.7.0')
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download release archive
        uses: actions/download-artifact@v4
        with:
          name: cortex-v0.7.0-windows-portable
          path: dist

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          awk '/^## \[v0.7.0\]/{found=1; next} /^## \[/{if(found) exit} found' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            dist/cortex-v0.7.0-windows-portable.zip

name: Publish Release

on:
  push:
    branches:
      - master
    paths:
      - CHANGELOG.md
      - README_INSTALL.txt
      - core/api/routes_mcp.cpp
      - core/api/semantic_tools.h
      - agent/semantic-tools.md
      - tests/semantic_tools_tests.cpp
      - tests/semantic_mcp_e2e.ps1
      - .github/workflows/publish-release.yml
  pull_request:
    paths:
      - CHANGELOG.md
      - README_INSTALL.txt
      - core/api/routes_mcp.cpp
      - core/api/semantic_tools.h
      - agent/semantic-tools.md
      - tests/semantic_tools_tests.cpp
      - tests/semantic_mcp_e2e.ps1
      - injector/**
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v0.5.0-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.5.0

jobs:
  build:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Release v0.5.0')
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            msystem: MINGW32
            prefix: mingw-w64-i686
            target_name: cortex_test_target_x86.exe
          - arch: x64
            msystem: MINGW64
            prefix: mingw-w64-x86_64
            target_name: cortex_test_target_x64.exe
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4

      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            ${{ matrix.prefix }}-gcc
            ${{ matrix.prefix }}-cmake
            ${{ matrix.prefix }}-ninja

      - name: Configure Cortex
        shell: msys2 {0}
        run: cmake -S . -B build/release-${{ matrix.arch }} -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build Cortex
        shell: msys2 {0}
        run: cmake --build build/release-${{ matrix.arch }} --parallel 2

      - name: Build semantic catalog tests
        shell: msys2 {0}
        run: >-
          c++ -std=c++17 -O2 tests/semantic_tools_tests.cpp
          -Ibuild/release-${{ matrix.arch }}/_deps/json-src/include
          -o build/release-${{ matrix.arch }}/cortex_semantic_tools_tests.exe
          -static -static-libgcc -static-libstdc++

      - name: Run semantic catalog tests
        shell: msys2 {0}
        run: >-
          build/release-${{ matrix.arch }}/cortex_semantic_tools_tests.exe
          core/api/routes_status.cpp

      - name: Run existing CTest suite
        shell: msys2 {0}
        run: ctest --test-dir build/release-${{ matrix.arch }} --output-on-failure

      - name: Build standalone compatibility injector
        shell: msys2 {0}
        run: >-
          c++ -std=c++17 -O2 injector/main.cpp
          -o build/release-${{ matrix.arch }}/injector.exe
          -static -static-libgcc -static-libstdc++

      - name: Inject Cortex and test all semantic MCP tools
        shell: pwsh
        run: |
          $root = Resolve-Path "build/release-${{ matrix.arch }}"
          $targetPath = Join-Path $root "${{ matrix.target_name }}"
          $injectorPath = Join-Path $root "injector.exe"
          $corePath = Join-Path $root "cortex_core.dll"
          $tokenPath = Join-Path $root "cortex.token"
          $semanticTests = Resolve-Path "tests/semantic_mcp_e2e.ps1"
          $target = Start-Process -FilePath $targetPath -PassThru
          try {
            Start-Sleep -Seconds 2
            & $injectorPath $target.Id $corePath
            if ($LASTEXITCODE -ne 0) { throw "Standalone Cortex injection failed" }

            $healthy = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:6969/health" -TimeoutSec 1
                if ($response.ok) {
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $healthy) { throw "Injected Cortex API did not become healthy" }
            if (-not (Test-Path $tokenPath)) { throw "Cortex token was not created at $tokenPath" }

            & $semanticTests -BaseUrl "http://127.0.0.1:6969" -TokenPath $tokenPath
          } finally {
            if (-not $target.HasExited) { Stop-Process -Id $target.Id -Force }
          }

      - name: Package and verify release
        shell: pwsh
        run: |
          $name = "cortex-${env:RELEASE_TAG}-windows-${{ matrix.arch }}"
          $stage = Join-Path $PWD "dist/$name"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "build/release-${{ matrix.arch }}/cortex_host.exe" $stage
          Copy-Item "build/release-${{ matrix.arch }}/cortex_core.dll" $stage
          Copy-Item "build/release-${{ matrix.arch }}/cortex_core.dll" (Join-Path $stage "cortex.asi")
          Copy-Item "build/release-${{ matrix.arch }}/injector.exe" $stage
          Copy-Item "build/release-${{ matrix.arch }}/${{ matrix.target_name }}" $stage
          Copy-Item README_INSTALL.txt $stage
          Copy-Item README.md $stage
          Copy-Item LICENSE $stage
          Copy-Item CHANGELOG.md $stage
          Copy-Item -Recurse docs (Join-Path $stage "docs")
          Copy-Item -Recurse sdk (Join-Path $stage "sdk")
          Copy-Item -Recurse agent (Join-Path $stage "agent")

          $required = @(
            "cortex_host.exe",
            "cortex_core.dll",
            "cortex.asi",
            "injector.exe",
            "${{ matrix.target_name }}",
            "README_INSTALL.txt",
            "README.md",
            "LICENSE",
            "CHANGELOG.md",
            "agent/semantic-tools.md"
          )
          foreach ($file in $required) {
            $path = Join-Path $stage $file
            if (-not (Test-Path $path)) { throw "missing packaged file: $file" }
            if ((Get-Item $path).Length -eq 0) { throw "empty packaged file: $file" }
          }

          $dllHash = (Get-FileHash (Join-Path $stage "cortex_core.dll") -Algorithm SHA256).Hash
          $asiHash = (Get-FileHash (Join-Path $stage "cortex.asi") -Algorithm SHA256).Hash
          if ($dllHash -ne $asiHash) { throw "cortex.asi must be byte-identical to cortex_core.dll" }

          Compress-Archive -Path "$stage/*" -DestinationPath "dist/$name.zip" -CompressionLevel Optimal
          if (-not (Test-Path "dist/$name.zip")) { throw "release ZIP was not created" }

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: cortex-${{ env.RELEASE_TAG }}-windows-${{ matrix.arch }}
          path: dist/cortex-${{ env.RELEASE_TAG }}-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v0.5.0')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout changelog
        uses: actions/checkout@v4

      - name: Download packaged builds
        uses: actions/download-artifact@v4
        with:
          pattern: cortex-${{ env.RELEASE_TAG }}-windows-*
          path: dist
          merge-multiple: true

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          awk '/^## \[v0.5.0\]/{found=1; next} /^## \[/{if(found) exit} found' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            dist/*.zip

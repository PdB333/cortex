name: Full Windows Build

on:
  push:
    branches:
      - agent/unified-cortex-host
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "core/**"
      - "host/**"
      - "injector/**"
      - "mcp_bridge/**"
      - "tools/**"
      - "test_target/**"
      - "tests/**"
      - "third_party/**"
      - ".github/workflows/full-windows-build.yml"
  workflow_dispatch:

jobs:
  full-build:
    name: full-build-${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msystem: MINGW64
            package_prefix: mingw-w64-x86_64
            target_name: cortex_test_target_x64.exe
          - arch: x86
            msystem: MINGW32
            package_prefix: mingw-w64-i686
            target_name: cortex_test_target_x86.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            ${{ matrix.package_prefix }}-gcc
            ${{ matrix.package_prefix }}-cmake
            ${{ matrix.package_prefix }}-ninja

      - name: Configure complete Cortex tree
        shell: msys2 {0}
        run: >-
          cmake -S . -B build/full-${{ matrix.arch }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build complete Cortex tree
        shell: msys2 {0}
        run: cmake --build build/full-${{ matrix.arch }} --parallel 2

      - name: Run CTest suite
        shell: msys2 {0}
        run: ctest --test-dir build/full-${{ matrix.arch }} --output-on-failure

      - name: Verify unified artifacts
        shell: pwsh
        run: |
          $root = Resolve-Path "build/full-${{ matrix.arch }}"
          foreach ($required in @("cortex_host.exe", "cortex_core.dll", "${{ matrix.target_name }}")) {
            if (-not (Test-Path (Join-Path $root $required))) {
              throw "missing required artifact: $required"
            }
          }
          foreach ($legacy in @("injector.exe", "cortex_mcp_bridge.exe", "cortex_diag_host.exe", "cortex_symbolize.exe")) {
            if (Test-Path (Join-Path $root $legacy)) {
              throw "legacy executable should not be produced: $legacy"
            }
          }

      - name: Inject Cortex into the test target
        shell: pwsh
        run: |
          $root = Resolve-Path "build/full-${{ matrix.arch }}"
          $targetPath = Join-Path $root "${{ matrix.target_name }}"
          $hostPath = Join-Path $root "cortex_host.exe"
          $corePath = Join-Path $root "cortex_core.dll"
          $target = Start-Process -FilePath $targetPath -PassThru
          try {
            Start-Sleep -Seconds 2
            & $hostPath inject $target.Id $corePath
            if ($LASTEXITCODE -ne 0) { throw "Cortex injection failed" }

            $healthy = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:6969/health" -TimeoutSec 1
                if ($response.ok) {
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $healthy) { throw "Injected Cortex API did not become healthy" }
          } finally {
            if (-not $target.HasExited) { Stop-Process -Id $target.Id -Force }
          }

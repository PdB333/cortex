name: Full Windows Build

on:
  push:
    branches:
      - agent/unified-cortex-host
      - refactor/native-mcp-tool-executor
  pull_request:
    paths:
      - "CMakeLists.txt"
      - "core/**"
      - "host/**"
      - "injector/**"
      - "mcp_bridge/**"
      - "tools/**"
      - "test_target/**"
      - "tests/**"
      - "third_party/**"
      - ".github/workflows/full-windows-build.yml"
  workflow_dispatch:

jobs:
  full-build:
    name: full-build-${{ matrix.arch }}
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            msystem: MINGW64
            package_prefix: mingw-w64-x86_64
            target_name: cortex_test_target_x64.exe
          - arch: x86
            msystem: MINGW32
            package_prefix: mingw-w64-i686
            target_name: cortex_test_target_x86.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            git
            ${{ matrix.package_prefix }}-gcc
            ${{ matrix.package_prefix }}-cmake
            ${{ matrix.package_prefix }}-ninja

      - name: Configure complete Cortex tree
        shell: msys2 {0}
        run: >-
          cmake -S . -B build/full-${{ matrix.arch }} -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON

      - name: Build complete Cortex tree
        shell: msys2 {0}
        run: cmake --build build/full-${{ matrix.arch }} --parallel 2

      - name: Build semantic catalog tests
        shell: msys2 {0}
        run: >-
          c++ -std=c++17 -O2 tests/semantic_tools_tests.cpp
          -Ibuild/full-${{ matrix.arch }}/_deps/json-src/include
          -o build/full-${{ matrix.arch }}/cortex_semantic_tools_tests.exe
          -static -static-libgcc -static-libstdc++

      - name: Run semantic catalog tests
        shell: msys2 {0}
        run: >-
          build/full-${{ matrix.arch }}/cortex_semantic_tools_tests.exe
          core/api/routes_status.cpp

      - name: Build standalone compatibility injector
        shell: msys2 {0}
        run: >-
          c++ -std=c++17 -O2 injector/main.cpp
          -o build/full-${{ matrix.arch }}/injector.exe
          -static -static-libgcc -static-libstdc++

      - name: Run CTest suite
        shell: msys2 {0}
        run: ctest --test-dir build/full-${{ matrix.arch }} --output-on-failure

      - name: Verify release-compatible artifacts
        shell: pwsh
        run: |
          $root = Resolve-Path "build/full-${{ matrix.arch }}"
          foreach ($required in @("cortex_host.exe", "cortex_core.dll", "injector.exe", "${{ matrix.target_name }}", "cortex_semantic_tools_tests.exe")) {
            if (-not (Test-Path (Join-Path $root $required))) {
              throw "missing required artifact: $required"
            }
          }
          foreach ($legacy in @("cortex_mcp_bridge.exe", "cortex_diag_host.exe", "cortex_symbolize.exe")) {
            if (Test-Path (Join-Path $root $legacy)) {
              throw "legacy executable should not be produced: $legacy"
            }
          }

      - name: Inject Cortex and test HTTP + native stdio MCP
        shell: pwsh
        run: |
          $root = Resolve-Path "build/full-${{ matrix.arch }}"
          $targetPath = Join-Path $root "${{ matrix.target_name }}"
          $injectorPath = Join-Path $root "injector.exe"
          $hostPath = Join-Path $root "cortex_host.exe"
          $corePath = Join-Path $root "cortex_core.dll"
          $tokenPath = Join-Path $root "cortex.token"
          $semanticTests = Resolve-Path "tests/semantic_mcp_e2e.ps1"
          $nativeTests = Resolve-Path "tests/native_mcp_stdio_e2e.ps1"
          $target = Start-Process -FilePath $targetPath -PassThru
          try {
            Start-Sleep -Seconds 2
            & $injectorPath $target.Id $corePath
            if ($LASTEXITCODE -ne 0) { throw "Standalone Cortex injection failed" }

            $healthy = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $response = Invoke-RestMethod -Uri "http://127.0.0.1:6969/health" -TimeoutSec 1
                if ($response.ok) {
                  $healthy = $true
                  break
                }
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if (-not $healthy) { throw "Injected Cortex API did not become healthy" }
            if (-not (Test-Path $tokenPath)) { throw "Cortex token was not created at $tokenPath" }

            & $semanticTests -BaseUrl "http://127.0.0.1:6969" -TokenPath $tokenPath
            if ($LASTEXITCODE -ne 0) { throw "HTTP MCP semantic E2E failed" }

            & $nativeTests -HostPath $hostPath -TokenPath $tokenPath
            if ($LASTEXITCODE -ne 0) { throw "Native stdio MCP E2E failed" }
          } finally {
            if (-not $target.HasExited) { Stop-Process -Id $target.Id -Force }
          }

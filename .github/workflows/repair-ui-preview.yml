name: Repair UI Preview workflow

on:
  push:
    branches:
      - next/unified-cortex-ui
    paths:
      - ".github/workflows/repair-ui-preview.yml"

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair exact workflow line and verify Git blob
        shell: python
        run: |
          from pathlib import Path
          import hashlib

          path = Path('.github/workflows/ui-preview.yml')
          text = path.read_text(encoding='utf-8')
          bad = '$trackEvents = @{ jsonrpc="2.0"; id=404; method="tools/call"; params=@{ name="re_object_events"; arguments=@{ _path=@{ id=$trackId } } } | ConvertTo-Json -Depth 8 -Compress'
          good = '$trackEvents = @{ jsonrpc="2.0"; id=404; method="tools/call"; params=@{ name="re_object_events"; arguments=@{ _path=@{ id=$trackId } } } } | ConvertTo-Json -Depth 8 -Compress'
          if text.count(bad) != 1:
              raise SystemExit(f'expected exactly one repair target, found {text.count(bad)}')
          text = text.replace(bad, good, 1)
          path.write_text(text, encoding='utf-8', newline='\n')

          data = path.read_bytes()
          blob = hashlib.sha1(f'blob {len(data)}\0'.encode('ascii') + data).hexdigest()
          expected = '229ff317b11e66c81e6e6b1ba06aede9b1f87473'
          print(f'ui-preview git blob: {blob}')
          if blob != expected:
              raise SystemExit(f'workflow still differs from local source of truth: expected {expected}, got {blob}')

      - name: Commit exact workflow and remove repair job
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ui-preview.yml
          git rm .github/workflows/repair-ui-preview.yml
          git commit -m "repair-ui-preview-workflow-exactly"
          git push origin HEAD:next/unified-cortex-ui

      - name: Dispatch repaired UI Preview gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ui-preview.yml/dispatches" \
            -d '{"ref":"next/unified-cortex-ui"}'

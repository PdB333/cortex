              $verifyRollback = @{ jsonrpc="2.0"; id=414; method="tools/call"; params=@{ name="memory_read"; arguments=@{ address=[string]$fixture.fake_state; type="u32" } } } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($verifyRollback); $mcp.StandardInput.Flush()

name: Unified Cortex UI Preview

on:
  push:
    branches:
      - next/unified-cortex-ui
    paths:
      - "app/**"
      - "core/target/**"
      - "core/services/**"
      - ".github/workflows/ui-preview.yml"
  workflow_dispatch:

concurrency:
  group: unified-cortex-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-x64-preview:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW + Qt 6
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-tools

      - name: Configure Cortex application preview
        shell: msys2 {0}
        run: cmake -S app -B build/ui -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build cortex.exe
        shell: msys2 {0}
        run: cmake --build build/ui --parallel 2

      - name: QML smoke test
        shell: msys2 {0}
        run: QT_QPA_PLATFORM=offscreen build/ui/cortex.exe --smoke-test

      - name: Create portable preview directory
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rm -rf dist/CortexPreview
          mkdir -p dist/CortexPreview
          cp build/ui/cortex.exe dist/CortexPreview/cortex.exe

          if command -v windeployqt6 >/dev/null 2>&1; then
            DEPLOY=windeployqt6
          else
            DEPLOY=windeployqt
          fi
          "$DEPLOY" --release --qmldir app/qml --no-translations dist/CortexPreview/cortex.exe

          for pass in 1 2 3 4 5 6 7 8; do
            copied=0
            while IFS= read -r -d '' pe; do
              while IFS= read -r dep; do
                [ -n "$dep" ] || continue
                base="$(basename "$dep")"
                if [ ! -f "dist/CortexPreview/$base" ]; then
                  cp "$dep" "dist/CortexPreview/$base"
                  echo "Bundled runtime dependency: $base"
                  copied=1
                fi
              done < <(ldd "$pe" 2>/dev/null | awk '/=> \/mingw64\/bin\// {print $3} /^\/mingw64\/bin\// {print $1}' | sort -u)
            done < <(find dist/CortexPreview -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
            [ "$copied" -eq 1 ] || break
          done

          printf '%s\n' \
            'Cortex unified application preview' \
            'Branch: next/unified-cortex-ui' \
            'This is a test artifact, not a public release.' \
            'Run cortex.exe and select a local target to inspect the unified runtime.' \
            > dist/CortexPreview/TESTING.txt

      - name: Verify portable runtime dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          missing=0
          while IFS= read -r -d '' pe; do
            unresolved="$(ldd "$pe" 2>/dev/null | awk '/not found/ {print}' || true)"
            if [ -n "$unresolved" ]; then
              echo "Unresolved dependencies for $pe:"
              echo "$unresolved"
              missing=1
            fi
          done < <(find dist/CortexPreview -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
          [ "$missing" -eq 0 ]

      - name: Portable smoke test with clean PATH
        shell: pwsh
        run: |
          $preview = (Resolve-Path "dist/CortexPreview").Path
          $oldPath = $env:PATH
          $stdout = Join-Path $env:RUNNER_TEMP "cortex-portable-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "cortex-portable-stderr.txt"
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
            $process = Start-Process `
              -FilePath (Join-Path $preview "cortex.exe") `
              -ArgumentList "--smoke-test" `
              -WorkingDirectory $preview `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -PassThru

            if (-not $process.WaitForExit(15000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Portable Cortex smoke test timed out"
            }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            $startupLog = Join-Path $preview "cortex-smoke.log"
            if (Test-Path $startupLog) { Get-Content $startupLog }
            if ($process.ExitCode -ne 0) {
              throw "Portable Cortex smoke test failed with exit code $($process.ExitCode)"
            }
          } finally {
            $env:PATH = $oldPath
          }

      - name: Upload testable application
        uses: actions/upload-artifact@v4
        with:
          name: cortex-unified-ui-preview-windows-x64
          path: dist/CortexPreview
          if-no-files-found: error
          retention-days: 14

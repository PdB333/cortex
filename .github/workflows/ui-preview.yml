              $checkpointVerify = @{ jsonrpc="2.0"; id=421; method="tools/call"; params=@{ name="memory_read"; arguments=@{ address=[string]$fixture.fake_state; type="u32" } } } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($checkpointVerify); $mcp.StandardInput.Flush()

name: Unified Cortex UI Preview

on:
  push:
    branches:
      - next/unified-cortex-ui
    paths:
      - "app/**"
      - "core/**"
      - "runtime_helper/**"
      - "CMakeLists.txt"
      - ".github/workflows/ui-preview.yml"
  workflow_dispatch:

concurrency:
  group: unified-cortex-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-x64-stage:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install x64 MinGW + Qt 6
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-tools

      - name: Configure Cortex application
        shell: msys2 {0}
        run: cmake -S app -B build/ui -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build cortex.exe
        shell: msys2 {0}
        run: cmake --build build/ui --parallel 2

      - name: Configure x64 target runtime
        shell: msys2 {0}
        run: >-
          cmake -S . -B build/runtime-x64 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF

      - name: Build x64 payload and E2E target
        shell: msys2 {0}
        run: cmake --build build/runtime-x64 --target core cortex_test_target --parallel 2

      - name: QML smoke test
        shell: msys2 {0}
        run: QT_QPA_PLATFORM=offscreen build/ui/cortex.exe --smoke-test

      - name: Stage x64 portable application
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rm -rf stage/x64
          mkdir -p stage/x64/CortexPreview/runtime/x64 stage/x64/e2e
          cp build/ui/cortex.exe stage/x64/CortexPreview/cortex.exe
          cp build/runtime-x64/cortex_core.dll stage/x64/CortexPreview/runtime/x64/cortex_core.dll
          cp build/runtime-x64/cortex_test_target_x64.exe stage/x64/e2e/cortex_test_target_x64.exe

          if command -v windeployqt6 >/dev/null 2>&1; then
            DEPLOY=windeployqt6
          else
            DEPLOY=windeployqt
          fi
          "$DEPLOY" --release --qmldir app/qml --no-translations stage/x64/CortexPreview/cortex.exe

          for pass in 1 2 3 4 5 6 7 8; do
            copied=0
            while IFS= read -r -d '' pe; do
              while IFS= read -r dep; do
                [ -n "$dep" ] || continue
                base="$(basename "$dep")"
                if [ ! -f "stage/x64/CortexPreview/$base" ]; then
                  cp "$dep" "stage/x64/CortexPreview/$base"
                  echo "Bundled x64 runtime dependency: $base"
                  copied=1
                fi
              done < <(ldd "$pe" 2>/dev/null | awk '/=> \/mingw64\/bin\// {print $3} /^\/mingw64\/bin\// {print $1}' | sort -u)
            done < <(find stage/x64/CortexPreview -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
            [ "$copied" -eq 1 ] || break
          done

      - name: Verify x64 dependency closure
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test -f stage/x64/CortexPreview/cortex.exe
          test -f stage/x64/CortexPreview/runtime/x64/cortex_core.dll
          test -f stage/x64/e2e/cortex_test_target_x64.exe
          missing=0
          while IFS= read -r -d '' pe; do
            unresolved="$(ldd "$pe" 2>/dev/null | awk '/not found/ {print}' || true)"
            if [ -n "$unresolved" ]; then
              echo "Unresolved dependencies for $pe:"
              echo "$unresolved"
              missing=1
            fi
          done < <(find stage/x64/CortexPreview -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
          [ "$missing" -eq 0 ]

      - name: Upload x64 staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: cortex-unified-x64-stage
          path: stage/x64
          if-no-files-found: error
          retention-days: 1

  windows-x86-stage:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install x86 MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja

      - name: Configure x86 target runtime
        shell: msys2 {0}
        run: >-
          cmake -S . -B build/runtime-x86 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF

      - name: Build x86 payload and E2E target
        shell: msys2 {0}
        run: cmake --build build/runtime-x86 --target core cortex_test_target --parallel 2

      - name: Build private x86 bootstrap helper
        shell: msys2 {0}
        run: >-
          c++ -std=c++17 -O2 -municode runtime_helper/main.cpp
          -o build/runtime-x86/cortex_runtime_helper.exe
          -static -static-libgcc -static-libstdc++

      - name: Stage and verify x86 runtime assets
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rm -rf stage/x86
          mkdir -p stage/x86/runtime/x86 stage/x86/e2e
          cp build/runtime-x86/cortex_core.dll stage/x86/runtime/x86/cortex_core.dll
          cp build/runtime-x86/cortex_runtime_helper.exe stage/x86/runtime/x86/cortex_runtime_helper.exe
          cp build/runtime-x86/cortex_test_target_x86.exe stage/x86/e2e/cortex_test_target_x86.exe

          test -f stage/x86/runtime/x86/cortex_core.dll
          test -f stage/x86/runtime/x86/cortex_runtime_helper.exe
          test -f stage/x86/e2e/cortex_test_target_x86.exe
          missing=0
          while IFS= read -r -d '' pe; do
            unresolved="$(ldd "$pe" 2>/dev/null | awk '/not found/ {print}' || true)"
            if [ -n "$unresolved" ]; then
              echo "Unresolved x86 dependencies for $pe:"
              echo "$unresolved"
              missing=1
            fi
          done < <(find stage/x86/runtime/x86 -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
          [ "$missing" -eq 0 ]

      - name: Upload x86 staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: cortex-unified-x86-stage
          path: stage/x86
          if-no-files-found: error
          retention-days: 1

  windows-portable-preview:
    needs: [windows-x64-stage, windows-x86-stage]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download x64 staging bundle
        uses: actions/download-artifact@v4
        with:
          name: cortex-unified-x64-stage
          path: staging/x64

      - name: Download x86 staging bundle
        uses: actions/download-artifact@v4
        with:
          name: cortex-unified-x86-stage
          path: staging/x86

      - name: Assemble one Cortex application bundle
        shell: pwsh
        run: |
          $preview = (Resolve-Path "staging/x64/CortexPreview").Path
          $x86Runtime = (Resolve-Path "staging/x86/runtime/x86").Path
          $destination = Join-Path $preview "runtime\x86"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item (Join-Path $x86Runtime "*") $destination -Force

          @(
            "Cortex unified application preview",
            "Branch: next/unified-cortex-ui",
            "This is a test artifact, not a public release.",
            "Run cortex.exe for the desktop application.",
            "Run cortex.exe mcp --pid <pid> or --process <name> for native MCP stdio.",
            "x64 and x86 target instrumentation are selected automatically.",
            "Files under runtime/ are private implementation assets, not separate Cortex products."
          ) | Set-Content -Encoding UTF8 (Join-Path $preview "TESTING.txt")

          foreach ($required in @(
            "cortex.exe",
            "runtime\x64\cortex_core.dll",
            "runtime\x86\cortex_core.dll",
            "runtime\x86\cortex_runtime_helper.exe"
          )) {
            if (-not (Test-Path (Join-Path $preview $required))) {
              throw "missing preview asset: $required"
            }
          }
          foreach ($notPublic in @("cortex_host.exe", "injector.exe", "cortex_mcp_bridge.exe", "cortex_runtime_helper.exe", "cortex_core.dll")) {
            if (Test-Path (Join-Path $preview $notPublic)) {
              throw "internal/legacy executable leaked into public bundle root: $notPublic"
            }
          }

      - name: Integrated MCP E2E on x64 and x86 targets
        shell: pwsh
        run: |
          $preview = (Resolve-Path "staging/x64/CortexPreview").Path
          $x64Target = (Resolve-Path "staging/x64/e2e/cortex_test_target_x64.exe").Path
          $x86Target = (Resolve-Path "staging/x86/e2e/cortex_test_target_x86.exe").Path
          $oldPath = $env:PATH

          function Read-McpLine([System.IO.StreamReader]$reader, [int]$timeoutMs = 15000) {
            $task = $reader.ReadLineAsync()
            if (-not $task.Wait($timeoutMs)) { throw "Timed out waiting for Cortex MCP stdout" }
            if ($null -eq $task.Result) { throw "Cortex MCP stdout closed unexpectedly" }
            return $task.Result
          }

          function Test-CortexMcp([string]$targetPath, [string]$assetDirectory, [string]$label) {
            $target = $null
            $mcp = $null
            $mcpStarted = $false
            try {
              Remove-Item (Join-Path $assetDirectory "cortex.token") -Force -ErrorAction SilentlyContinue
              $safeLabel = $label -replace '[^a-zA-Z0-9_-]', '-'
              $manifestPath = Join-Path $env:RUNNER_TEMP "cortex-fixture-$safeLabel.json"
              Remove-Item $manifestPath -Force -ErrorAction SilentlyContinue
              $target = Start-Process -FilePath $targetPath -ArgumentList @("--e2e-manifest", $manifestPath) -PassThru
              for ($attempt = 0; $attempt -lt 50 -and -not (Test-Path $manifestPath); $attempt++) {
                Start-Sleep -Milliseconds 100
              }
              if (-not (Test-Path $manifestPath)) { throw "$label fixture manifest was not created" }
              $fixture = Get-Content $manifestPath -Raw | ConvertFrom-Json
              Start-Sleep -Milliseconds 250

              $start = [System.Diagnostics.ProcessStartInfo]::new()
              $start.FileName = Join-Path $preview "cortex.exe"
              $start.Arguments = "mcp --pid $($target.Id) --tools all"
              $start.WorkingDirectory = $preview
              $start.UseShellExecute = $false
              $start.RedirectStandardInput = $true
              $start.RedirectStandardOutput = $true
              $start.RedirectStandardError = $true
              $start.CreateNoWindow = $true

              $mcp = [System.Diagnostics.Process]::new()
              $mcp.StartInfo = $start
              if (-not $mcp.Start()) { throw "Failed to start Cortex MCP for $label" }
              $mcpStarted = $true

              $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"preview-ci","version":"1"}}}')
              $mcp.StandardInput.Flush()
              $init = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if ($init.id -ne 1 -or $init.result.protocolVersion -ne "2025-11-25") {
                throw "$label legacy MCP negotiation failed"
              }

              $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","method":"notifications/initialized"}')
              $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')
              $mcp.StandardInput.Flush()
              $tools = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if ($tools.id -ne 2 -or -not ($tools.result.tools.name -contains "debug_breakpoint_add")) {
                throw "$label full MCP catalog is incomplete"
              }

              $structInferTool = @($tools.result.tools | Where-Object { $_.name -eq "struct_infer" })
              if ($structInferTool.Count -ne 1 -or
                  $structInferTool[0]._cortex.risk -ne "analyze" -or
                  $structInferTool[0]._cortex.mutation_permission_required -or
                  $structInferTool[0]._cortex.mutation_permission_when -ne "define=true" -or
                  $structInferTool[0].inputSchema.properties.define.type -ne "boolean" -or
                  ($structInferTool[0].inputSchema.required -contains "name")) {
                throw "$label struct_infer MCP risk metadata is incorrect"
              }
              $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"status","arguments":{}}}')
              $mcp.StandardInput.Flush()
              $status = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $reportedPid = [int64]$status.result.structuredContent.result.pid
              if ($status.id -ne 3 -or $reportedPid -ne [int64]$target.Id) {
                throw "$label status resolved the wrong target"
              }
              # Contract coherence: startup already refuses invalid manifests; this
              # explicit probe makes the guarantee visible in the portable gate.
              $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":4,"method":"tools/call","params":{"name":"schema_validate","arguments":{}}}')
              $mcp.StandardInput.Flush()
              $schemaResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $schemaResult = $schemaResponse.result.structuredContent.result
              if ($schemaResponse.id -ne 4 -or -not $schemaResult.ok -or [int]$schemaResult.tool_count -lt 1) {
                throw "$label API manifest/native-route validation failed"
              }

              $fixtureU32Text = [string]$fixture.u32
              $fixtureU32Numeric = [Convert]::ToUInt64(($fixtureU32Text -replace '^0x',''), 16)
              $readText = @{ jsonrpc="2.0"; id=5; method="tools/call"; params=@{ name="memory_read"; arguments=@{ address=$fixtureU32Text; type="u32" } } } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($readText); $mcp.StandardInput.Flush()
              $readTextResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $readNumeric = @{ jsonrpc="2.0"; id=6; method="tools/call"; params=@{ name="memory_read"; arguments=@{ address=$fixtureU32Numeric; type="u32" } } } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($readNumeric); $mcp.StandardInput.Flush()
              $readNumericResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if ([uint64]$readTextResponse.result.structuredContent.result.value -ne [uint64]$readNumericResponse.result.structuredContent.result.value) {
                throw "$label numeric and hex-string address forms disagree"
              }

              # Real target-thread native call. cortex_test_target's main TID owns
              # a PeekMessage loop, so call_on_thread must marshal there without
              # suspend/context hijacking and return the function's EAX/RAX value.
              $threadCall = @{
                jsonrpc="2.0"; id=7; method="tools/call"
                params=@{ name="call_on_thread"; arguments=@{
                  thread_id=[uint64]$fixture.main_thread_id
                  address=[string]$fixture.native_add
                  args=@(10,20,12)
                  convention="cdecl"
                  timeout_ms=3000
                  mutation_permission=$true
                } }
              } | ConvertTo-Json -Depth 10 -Compress
              $mcp.StandardInput.WriteLine($threadCall); $mcp.StandardInput.Flush()
              $threadCallResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $threadCallResult = $threadCallResponse.result.structuredContent.result
              if ($threadCallResponse.id -ne 7 -or -not $threadCallResult.ok -or
                  [uint64]$threadCallResult.return_value_u64 -ne 42 -or
                  [uint64]$threadCallResult.thread_id -ne [uint64]$fixture.main_thread_id) {
                throw "$label call_on_thread did not execute on the requested target TID"
              }

              # Install a process-global HW write breakpoint *before* a new writer
              # thread exists. The new thread must inherit DR state automatically.
              $hwAdd = @{
                jsonrpc="2.0"; id=8; method="tools/call"
                params=@{ name="debug_breakpoint_add"; arguments=@{
                  address=[string]$fixture.hw_value; kind="hw_write"; size=4; action="log"
                  process_global=$true; mutation_permission=$true
                } }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($hwAdd); $mcp.StandardInput.Flush()
              $hwAddResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $hwId = [int]$hwAddResponse.result.structuredContent.result.id
              if ($hwAddResponse.id -ne 8 -or $hwId -le 0) { throw "$label failed to arm process-global HW breakpoint" }

              $hwEvent = [System.Threading.EventWaitHandle]::OpenExisting([string]$fixture.hw_thread_event)
              [void]$hwEvent.Set()
              $hwHit = $null
              for ($attempt = 0; $attempt -lt 30 -and -not $hwHit; $attempt++) {
                Start-Sleep -Milliseconds 50
                $hwLog = @{ jsonrpc="2.0"; id=9; method="tools/call"; params=@{ name="debug_breakpoint_log"; arguments=@{ _path=@{ id=$hwId }; limit=8 } } } | ConvertTo-Json -Depth 8 -Compress
                $mcp.StandardInput.WriteLine($hwLog); $mcp.StandardInput.Flush()
                $hwLogResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
                $entries = @($hwLogResponse.result.structuredContent.result.entries)
                if ($entries.Count -gt 0) { $hwHit = $entries[0] }
              }
              if (-not $hwHit) { throw "$label process-global HW breakpoint missed a newly created writer thread" }

              $writerTidRead = @{ jsonrpc="2.0"; id=9; method="tools/call"; params=@{ name="memory_read"; arguments=@{ address=[string]$fixture.hw_writer_tid; type="u32" } } } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($writerTidRead); $mcp.StandardInput.Flush()
              $writerTidResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $writerTid = [uint64]$writerTidResponse.result.structuredContent.result.value
              if ($writerTid -eq 0 -or [uint64]$hwHit.thread_id -ne $writerTid) {
                throw "$label HW breakpoint hit did not come from the newly created worker TID"
              }

              $hwList = @{ jsonrpc="2.0"; id=9; method="tools/call"; params=@{ name="debug_breakpoint_list"; arguments=@{} } } | ConvertTo-Json -Depth 6 -Compress
              $mcp.StandardInput.WriteLine($hwList); $mcp.StandardInput.Flush()
              $hwListResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $hwRow = @($hwListResponse.result.structuredContent.result.breakpoints | Where-Object { [int]$_.id -eq $hwId })
              if ($hwRow.Count -ne 1 -or -not $hwRow[0].process_global -or [int]$hwRow[0].applied_threads -lt 1) {
                throw "$label HW breakpoint coverage metadata is incomplete"
              }

              $hwDelete = @{ jsonrpc="2.0"; id=9; method="tools/call"; params=@{ name="debug_breakpoint_delete"; arguments=@{ _path=@{ id=$hwId }; mutation_permission=$true } } } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($hwDelete); $mcp.StandardInput.Flush()
              [void]((Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json)
              $hwEvent.Dispose()
              $trackedStructName = "PreviewFakeObject-$safeLabel"
              $stateOffset = [int]$fixture.pointer_size * 2
              $modeOffset = $stateOffset + 4
              $defineTrackedStruct = @{ jsonrpc="2.0"; id=399; method="tools/call"; params=@{ name="struct_define"; arguments=@{
                name=$trackedStructName
                fields=@(
                  @{ name="primaryVtable"; offset=0; type="vtable" },
                  @{ name="secondaryVtable"; offset=[int]$fixture.pointer_size; type="vtable" },
                  @{ name="state"; offset=$stateOffset; type="u32" },
                  @{ name="mode"; offset=$modeOffset; type="u32" }
                )
                mutation_permission=$true
              } } } | ConvertTo-Json -Depth 12 -Compress
              $mcp.StandardInput.WriteLine($defineTrackedStruct); $mcp.StandardInput.Flush()
              $defineTrackedStructResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if ($defineTrackedStructResponse.id -ne 399 -or -not $defineTrackedStructResponse.result.structuredContent.result.ok) {
                throw "$label could not define the tracked-object struct"
              }
              # C++ subobject detection on a deterministic object containing two
              # valid vtable pointers.
              $subobjectsCall = @{ jsonrpc="2.0"; id=400; method="tools/call"; params=@{ name="re_cpp_subobjects"; arguments=@{ address=[string]$fixture.fake_object; size=[int]$fixture.fake_object_size } } } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($subobjectsCall); $mcp.StandardInput.Flush()
              $subobjectsResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $subobjectsResult = $subobjectsResponse.result.structuredContent.result
              if ($subobjectsResponse.id -ne 400 -or -not $subobjectsResult.ok -or @($subobjectsResult.subobjects).Count -lt 2 -or -not $subobjectsResult.multiple_inheritance_likely) {
                throw "$label C++ subobject/vtable detection failed"
              }

              $trackName = "preview-$safeLabel-fake-object"
              $trackCall = @{
                jsonrpc="2.0"; id=401; method="tools/call"
                params=@{ name="re_track_object"; arguments=@{
                  name=$trackName; address=[string]$fixture.fake_object; size=[int]$fixture.fake_object_size
                  struct_name=$trackedStructName; persist=$false; mutation_permission=$true
                } }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($trackCall); $mcp.StandardInput.Flush()
              $trackResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $trackId = [int]$trackResponse.result.structuredContent.result.id
              if ($trackResponse.id -ne 401 -or $trackId -le 0) { throw "$label object tracker could not start" }
              Start-Sleep -Milliseconds 350

              $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":402,"method":"tools/call","params":{"name":"session_export","arguments":{}}}')
              $mcp.StandardInput.Flush()
              $sessionAResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $sessionA = [string]$sessionAResponse.result.structuredContent.result.id
              if ($sessionAResponse.id -ne 402 -or [string]::IsNullOrWhiteSpace($sessionA)) { throw "$label first RE run export failed" }

              $mutateTracked = @{ jsonrpc="2.0"; id=403; method="tools/call"; params=@{ name="memory_write"; arguments=@{ address=[string]$fixture.fake_state; type="u32"; value=91; mutation_permission=$true } } } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($mutateTracked); $mcp.StandardInput.Flush()
              $mutateTrackedResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if (-not $mutateTrackedResponse.result.structuredContent.result.ok) { throw "$label could not mutate tracked object" }
              Start-Sleep -Milliseconds 400

              $trackEvents = @{ jsonrpc="2.0"; id=404; method="tools/call"; params=@{ name="re_object_events"; arguments=@{ _path=@{ id=$trackId } } } } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($trackEvents); $mcp.StandardInput.Flush()
              $trackEventsResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $changedEvents = @($trackEventsResponse.result.structuredContent.result.events | Where-Object { $_.type -eq "fields_changed" })
              if ($changedEvents.Count -lt 1) { throw "$label tracked-object field changes were not detected" }

              # Session ids have second resolution; ensure the second export is a
              # distinct durable run and then compare it to the first one.
              Start-Sleep -Milliseconds 1100
              $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":405,"method":"tools/call","params":{"name":"session_export","arguments":{}}}')
              $mcp.StandardInput.Flush()
              $sessionBResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $sessionB = [string]$sessionBResponse.result.structuredContent.result.id
              if ($sessionBResponse.id -ne 405 -or [string]::IsNullOrWhiteSpace($sessionB) -or $sessionB -eq $sessionA) { throw "$label second RE run export failed" }

              $sessionDiff = @{ jsonrpc="2.0"; id=406; method="tools/call"; params=@{ name="session_diff"; arguments=@{ a=$sessionA; b=$sessionB } } } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($sessionDiff); $mcp.StandardInput.Flush()
              $sessionDiffResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $sessionDiffResult = $sessionDiffResponse.result.structuredContent.result
              $trackedDiff = @($sessionDiffResult.objects | Where-Object { $_.name -eq $trackName -and $_.state -eq "changed" })
              if ($sessionDiffResponse.id -ne 406 -or -not $sessionDiffResult.ok -or $trackedDiff.Count -ne 1) {
                throw "$label cross-run tracked-object diff failed"
              }
              $stateFieldDiff = $trackedDiff[0].field_differences.PSObject.Properties["state"]
              if ($null -eq $stateFieldDiff) { throw "$label cross-run typed field diff did not report state" }

              $restoreTracked = @{ jsonrpc="2.0"; id=407; method="tools/call"; params=@{ name="memory_write"; arguments=@{ address=[string]$fixture.fake_state; type="u32"; value=7; mutation_permission=$true } } } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($restoreTracked); $mcp.StandardInput.Flush(); [void]((Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json)
              $deleteTrack = @{ jsonrpc="2.0"; id=408; method="tools/call"; params=@{ name="re_object_delete"; arguments=@{ _path=@{ id=$trackId }; mutation_permission=$true } } } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($deleteTrack); $mcp.StandardInput.Flush(); [void]((Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json)
              $deleteTrackedStruct = @{ jsonrpc="2.0"; id=409; method="tools/call"; params=@{ name="struct_delete"; arguments=@{ _path=@{ name=$trackedStructName }; mutation_permission=$true } } } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($deleteTrackedStruct); $mcp.StandardInput.Flush(); [void]((Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json)
              # High-level who-wrote-this with a deterministic trigger that is
              # executed by Cortex only after the process-global HW watch is armed.
              $lastWriterCall = @{
                jsonrpc="2.0"; id=410; method="tools/call"
                params=@{ name="re_find_last_writer"; arguments=@{
                  address=[string]$fixture.hw_value; size=4; timeout_ms=4000
                  after_arm=@{
                    method="POST"; path="/call/thread"
                    body=@{ thread_id=[uint32]$fixture.main_thread_id; address=[string]$fixture.native_increment_hw_value; args=@(); convention="cdecl"; timeout_ms=3000 }

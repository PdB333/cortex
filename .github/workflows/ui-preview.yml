name: Unified Cortex UI Preview

on:
  push:
    branches:
      - next/unified-cortex-ui
    paths:
      - "app/**"
      - "core/**"
      - "runtime_helper/**"
      - "CMakeLists.txt"
      - ".github/workflows/ui-preview.yml"
  workflow_dispatch:

concurrency:
  group: unified-cortex-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-x64-stage:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install x64 MinGW + Qt 6
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-tools

      - name: Configure Cortex application
        shell: msys2 {0}
        run: cmake -S app -B build/ui -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build cortex.exe
        shell: msys2 {0}
        run: cmake --build build/ui --parallel 2

      - name: Configure x64 target runtime
        shell: msys2 {0}
        run: >-
          cmake -S . -B build/runtime-x64 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF

      - name: Build x64 payload and E2E target
        shell: msys2 {0}
        run: cmake --build build/runtime-x64 --target core cortex_test_target --parallel 2

      - name: QML smoke test
        shell: msys2 {0}
        run: QT_QPA_PLATFORM=offscreen build/ui/cortex.exe --smoke-test

      - name: Stage x64 portable application
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rm -rf stage/x64
          mkdir -p stage/x64/CortexPreview/runtime/x64 stage/x64/e2e
          cp build/ui/cortex.exe stage/x64/CortexPreview/cortex.exe
          cp build/runtime-x64/cortex_core.dll stage/x64/CortexPreview/runtime/x64/cortex_core.dll
          cp build/runtime-x64/cortex_test_target_x64.exe stage/x64/e2e/cortex_test_target_x64.exe

          if command -v windeployqt6 >/dev/null 2>&1; then
            DEPLOY=windeployqt6
          else
            DEPLOY=windeployqt
          fi
          "$DEPLOY" --release --qmldir app/qml --no-translations stage/x64/CortexPreview/cortex.exe

          for pass in 1 2 3 4 5 6 7 8; do
            copied=0
            while IFS= read -r -d '' pe; do
              while IFS= read -r dep; do
                [ -n "$dep" ] || continue
                base="$(basename "$dep")"
                if [ ! -f "stage/x64/CortexPreview/$base" ]; then
                  cp "$dep" "stage/x64/CortexPreview/$base"
                  echo "Bundled x64 runtime dependency: $base"
                  copied=1
                fi
              done < <(ldd "$pe" 2>/dev/null | awk '/=> \/mingw64\/bin\// {print $3} /^\/mingw64\/bin\// {print $1}' | sort -u)
            done < <(find stage/x64/CortexPreview -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
            [ "$copied" -eq 1 ] || break
          done

      - name: Verify x64 dependency closure
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test -f stage/x64/CortexPreview/cortex.exe
          test -f stage/x64/CortexPreview/runtime/x64/cortex_core.dll
          test -f stage/x64/e2e/cortex_test_target_x64.exe
          missing=0
          while IFS= read -r -d '' pe; do
            unresolved="$(ldd "$pe" 2>/dev/null | awk '/not found/ {print}' || true)"
            if [ -n "$unresolved" ]; then
              echo "Unresolved dependencies for $pe:"
              echo "$unresolved"
              missing=1
            fi
          done < <(find stage/x64/CortexPreview -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
          [ "$missing" -eq 0 ]

      - name: Upload x64 staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: cortex-unified-x64-stage
          path: stage/x64
          if-no-files-found: error
          retention-days: 1

  windows-x86-stage:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Install x86 MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: >-
            git
            mingw-w64-i686-gcc
            mingw-w64-i686-cmake
            mingw-w64-i686-ninja

      - name: Configure x86 target runtime
        shell: msys2 {0}
        run: >-
          cmake -S . -B build/runtime-x86 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF

      - name: Build x86 payload and E2E target
        shell: msys2 {0}
        run: cmake --build build/runtime-x86 --target core cortex_test_target --parallel 2

      - name: Build private x86 bootstrap helper
        shell: msys2 {0}
        run: >-
          c++ -std=c++17 -O2 -municode runtime_helper/main.cpp
          -o build/runtime-x86/cortex_runtime_helper.exe
          -static -static-libgcc -static-libstdc++

      - name: Stage and verify x86 runtime assets
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rm -rf stage/x86
          mkdir -p stage/x86/runtime/x86 stage/x86/e2e
          cp build/runtime-x86/cortex_core.dll stage/x86/runtime/x86/cortex_core.dll
          cp build/runtime-x86/cortex_runtime_helper.exe stage/x86/runtime/x86/cortex_runtime_helper.exe
          cp build/runtime-x86/cortex_test_target_x86.exe stage/x86/e2e/cortex_test_target_x86.exe

          test -f stage/x86/runtime/x86/cortex_core.dll
          test -f stage/x86/runtime/x86/cortex_runtime_helper.exe
          test -f stage/x86/e2e/cortex_test_target_x86.exe
          missing=0
          while IFS= read -r -d '' pe; do
            unresolved="$(ldd "$pe" 2>/dev/null | awk '/not found/ {print}' || true)"
            if [ -n "$unresolved" ]; then
              echo "Unresolved x86 dependencies for $pe:"
              echo "$unresolved"
              missing=1
            fi
          done < <(find stage/x86/runtime/x86 -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
          [ "$missing" -eq 0 ]

      - name: Upload x86 staging bundle
        uses: actions/upload-artifact@v4
        with:
          name: cortex-unified-x86-stage
          path: stage/x86
          if-no-files-found: error
          retention-days: 1

  windows-portable-preview:
    needs: [windows-x64-stage, windows-x86-stage]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Download x64 staging bundle
        uses: actions/download-artifact@v4
        with:
          name: cortex-unified-x64-stage
          path: staging/x64

      - name: Download x86 staging bundle
        uses: actions/download-artifact@v4
        with:
          name: cortex-unified-x86-stage
          path: staging/x86

      - name: Assemble one Cortex application bundle
        shell: pwsh
        run: |
          $preview = (Resolve-Path "staging/x64/CortexPreview").Path
          $x86Runtime = (Resolve-Path "staging/x86/runtime/x86").Path
          $destination = Join-Path $preview "runtime\x86"
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item (Join-Path $x86Runtime "*") $destination -Force

          @(
            "Cortex unified application preview",
            "Branch: next/unified-cortex-ui",
            "This is a test artifact, not a public release.",
            "Run cortex.exe for the desktop application.",
            "Run cortex.exe mcp --pid <pid> or --process <name> for native MCP stdio.",
            "x64 and x86 target instrumentation are selected automatically.",
            "Files under runtime/ are private implementation assets, not separate Cortex products."
          ) | Set-Content -Encoding UTF8 (Join-Path $preview "TESTING.txt")

          foreach ($required in @(
            "cortex.exe",
            "runtime\x64\cortex_core.dll",
            "runtime\x86\cortex_core.dll",
            "runtime\x86\cortex_runtime_helper.exe"
          )) {
            if (-not (Test-Path (Join-Path $preview $required))) {
              throw "missing preview asset: $required"
            }
          }
          foreach ($notPublic in @("cortex_host.exe", "injector.exe", "cortex_mcp_bridge.exe", "cortex_runtime_helper.exe", "cortex_core.dll")) {
            if (Test-Path (Join-Path $preview $notPublic)) {
              throw "internal/legacy executable leaked into public bundle root: $notPublic"
            }
          }

      - name: Integrated MCP E2E on x64 and x86 targets
        shell: pwsh
        run: |
          $preview = (Resolve-Path "staging/x64/CortexPreview").Path
          $x64Target = (Resolve-Path "staging/x64/e2e/cortex_test_target_x64.exe").Path
          $x86Target = (Resolve-Path "staging/x86/e2e/cortex_test_target_x86.exe").Path
          $oldPath = $env:PATH

          function Read-McpLine([System.IO.StreamReader]$reader, [int]$timeoutMs = 15000) {
            $task = $reader.ReadLineAsync()
            if (-not $task.Wait($timeoutMs)) { throw "Timed out waiting for Cortex MCP stdout" }
            if ($null -eq $task.Result) { throw "Cortex MCP stdout closed unexpectedly" }
            return $task.Result
          }

          function Test-CortexMcp([string]$targetPath, [string]$assetDirectory, [string]$label) {
            $target = $null
            $mcp = $null
            $mcpStarted = $false
            try {
              Remove-Item (Join-Path $assetDirectory "cortex.token") -Force -ErrorAction SilentlyContinue
              $safeLabel = $label -replace '[^a-zA-Z0-9_-]', '-'
              $manifestPath = Join-Path $env:RUNNER_TEMP "cortex-fixture-$safeLabel.json"
              Remove-Item $manifestPath -Force -ErrorAction SilentlyContinue
              $target = Start-Process -FilePath $targetPath -ArgumentList @("--e2e-manifest", $manifestPath) -PassThru
              for ($attempt = 0; $attempt -lt 50 -and -not (Test-Path $manifestPath); $attempt++) {
                Start-Sleep -Milliseconds 100
              }
              if (-not (Test-Path $manifestPath)) { throw "$label fixture manifest was not created" }
              $fixture = Get-Content $manifestPath -Raw | ConvertFrom-Json
              Start-Sleep -Milliseconds 250

              $start = [System.Diagnostics.ProcessStartInfo]::new()
              $start.FileName = Join-Path $preview "cortex.exe"
              $start.Arguments = "mcp --pid $($target.Id) --tools all"
              $start.WorkingDirectory = $preview
              $start.UseShellExecute = $false
              $start.RedirectStandardInput = $true
              $start.RedirectStandardOutput = $true
              $start.RedirectStandardError = $true
              $start.CreateNoWindow = $true

              $mcp = [System.Diagnostics.Process]::new()
              $mcp.StartInfo = $start
              if (-not $mcp.Start()) { throw "Failed to start Cortex MCP for $label" }
              $mcpStarted = $true

              $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"preview-ci","version":"1"}}}')
              $mcp.StandardInput.Flush()
              $init = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if ($init.id -ne 1 -or $init.result.protocolVersion -ne "2025-11-25") {
                throw "$label legacy MCP negotiation failed"
              }

              $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","method":"notifications/initialized"}')
              $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')
              $mcp.StandardInput.Flush()
              $tools = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if ($tools.id -ne 2 -or -not ($tools.result.tools.name -contains "debug_breakpoint_add")) {
                throw "$label full MCP catalog is incomplete"
              }

              $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"status","arguments":{}}}')
              $mcp.StandardInput.Flush()
              $status = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $reportedPid = [int64]$status.result.structuredContent.result.pid
              if ($status.id -ne 3 -or $reportedPid -ne [int64]$target.Id) {
                throw "$label status resolved the wrong target"
              }

              if (-not ($tools.result.tools.name -contains "trace_stop") -or
                  -not ($tools.result.tools.name -contains "trace_delete")) {
                throw "$label trace lifecycle tools are missing from the MCP catalog"
              }

              $createPrompt = @{
                jsonrpc = "2.0"
                id = 4
                method = "tools/call"
                params = @{
                  name = "prompt_value_change"
                  arguments = @{
                    label = "Qt prompt E2E"
                    current_value = "before"
                    target_value = "after"
                  }
                }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($createPrompt)
              $mcp.StandardInput.Flush()
              $created = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $promptId = [int]$created.result.structuredContent.result.id
              if ($created.id -ne 4 -or $promptId -le 0) {
                throw "$label failed to create the Qt prompt E2E request"
              }

              $promptStdout = Join-Path $env:RUNNER_TEMP "cortex-prompt-$label-stdout.txt"
              $promptStderr = Join-Path $env:RUNNER_TEMP "cortex-prompt-$label-stderr.txt"
              $promptProcess = Start-Process `
                -FilePath (Join-Path $preview "cortex.exe") `
                -ArgumentList @("--prompt-channel-smoke", "--pid", $target.Id, "--answer", "qt-e2e") `
                -WorkingDirectory $preview `
                -RedirectStandardOutput $promptStdout `
                -RedirectStandardError $promptStderr `
                -PassThru
              if (-not $promptProcess.WaitForExit(15000)) {
                Stop-Process -Id $promptProcess.Id -Force -ErrorAction SilentlyContinue
                throw "$label Qt prompt channel smoke timed out"
              }
              if (Test-Path $promptStdout) { Get-Content $promptStdout }
              if (Test-Path $promptStderr) { Get-Content $promptStderr }
              if ($promptProcess.ExitCode -ne 0) {
                throw "$label Qt prompt channel smoke failed with $($promptProcess.ExitCode)"
              }

              $promptStatusRequest = @{
                jsonrpc = "2.0"
                id = 5
                method = "tools/call"
                params = @{
                  name = "prompt_status"
                  arguments = @{ _path = @{ id = $promptId } }
                }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($promptStatusRequest)
              $mcp.StandardInput.Flush()
              $promptStatus = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $promptResult = $promptStatus.result.structuredContent.result
              if ($promptStatus.id -ne 5 -or $promptResult.status -ne "answered" -or $promptResult.response -ne "qt-e2e") {
                throw "$label Qt prompt channel did not persist the desktop answer"
              }

              $eventStdout = Join-Path $env:RUNNER_TEMP "cortex-event-$label-stdout.txt"
              $eventStderr = Join-Path $env:RUNNER_TEMP "cortex-event-$label-stderr.txt"
              $eventProcess = Start-Process `
                -FilePath (Join-Path $preview "cortex.exe") `
                -ArgumentList @("--event-channel-smoke", "--pid", $target.Id, "--expect", "prompt.answered") `
                -WorkingDirectory $preview `
                -RedirectStandardOutput $eventStdout `
                -RedirectStandardError $eventStderr `
                -PassThru
              if (-not $eventProcess.WaitForExit(15000)) {
                Stop-Process -Id $eventProcess.Id -Force -ErrorAction SilentlyContinue
                throw "$label Qt event channel smoke timed out"
              }
              if (Test-Path $eventStdout) { Get-Content $eventStdout }
              if (Test-Path $eventStderr) { Get-Content $eventStderr }
              if ($eventProcess.ExitCode -ne 0) {
                throw "$label Qt event channel smoke failed with $($eventProcess.ExitCode)"
              }

              $addressName = "preview-" + ($label -replace '[^a-zA-Z0-9_-]', '-') + "-address"
              $setAddress = @{
                jsonrpc = "2.0"
                id = 6
                method = "tools/call"
                params = @{
                  name = "project_address_set"
                  arguments = @{
                    name = $addressName
                    address = "0x1234"
                    type = "i32"
                    notes = "portable project e2e"
                    mutation_permission = $true
                  }
                }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($setAddress)
              $mcp.StandardInput.Flush()
              $setAddressResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if ($setAddressResponse.id -ne 6 -or -not $setAddressResponse.result.structuredContent.result.ok) {
                throw "$label failed to persist a project address"
              }

              $noteText = "portable project note $label"
              $addNote = @{
                jsonrpc = "2.0"
                id = 7
                method = "tools/call"
                params = @{
                  name = "project_note_add"
                  arguments = @{
                    text = $noteText
                    tags = @("ci", "portable")
                    mutation_permission = $true
                  }
                }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($addNote)
              $mcp.StandardInput.Flush()
              $noteResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $noteId = [int]$noteResponse.result.structuredContent.result.id
              if ($noteResponse.id -ne 7 -or $noteId -le 0) {
                throw "$label failed to persist a project note"
              }

              $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":8,"method":"tools/call","params":{"name":"project_get","arguments":{}}}')
              $mcp.StandardInput.Flush()
              $projectResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $project = $projectResponse.result.structuredContent.result
              if ($projectResponse.id -ne 8 -or $project.addresses.$addressName.address -ne "0x1234" -or
                  -not ($project.notes | Where-Object { $_.id -eq $noteId -and $_.text -eq $noteText })) {
                throw "$label project persistence roundtrip failed"
              }

              $pointerName = "preview-" + ($label -replace '[^a-zA-Z0-9_-]', '-') + "-pointer"
              $setPointer = @{
                jsonrpc = "2.0"
                id = 9
                method = "tools/call"
                params = @{
                  name = "project_pointer_path_set"
                  arguments = @{
                    name = $pointerName
                    base_offset = 0
                    offsets = @()
                    final_type = "ptr"
                    notes = "portable project pointer e2e"
                    mutation_permission = $true
                  }
                }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($setPointer)
              $mcp.StandardInput.Flush()
              $setPointerResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if ($setPointerResponse.id -ne 9 -or -not $setPointerResponse.result.structuredContent.result.ok) {
                throw "$label failed to persist a project pointer path"
              }

              $resolvePointer = @{
                jsonrpc = "2.0"
                id = 10
                method = "tools/call"
                params = @{
                  name = "project_pointer_path_resolve"
                  arguments = @{ _path = @{ name = $pointerName } }
                }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($resolvePointer)
              $mcp.StandardInput.Flush()
              $resolvePointerResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $resolvedPointer = [string]$resolvePointerResponse.result.structuredContent.result.address
              if ($resolvePointerResponse.id -ne 10 -or -not $resolvePointerResponse.result.structuredContent.result.ok -or -not $resolvedPointer.StartsWith("0x")) {
                throw "$label project pointer path did not resolve"
              }

              $deletePointer = @{
                jsonrpc = "2.0"
                id = 11
                method = "tools/call"
                params = @{
                  name = "project_pointer_path_delete"
                  arguments = @{ _path = @{ name = $pointerName }; mutation_permission = $true }
                }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($deletePointer)
              $mcp.StandardInput.Flush()
              $deletePointerResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if ($deletePointerResponse.id -ne 11 -or -not $deletePointerResponse.result.structuredContent.result.ok) {
                throw "$label failed to clean the project pointer path"
              }
              $deleteAddress = @{
                jsonrpc = "2.0"
                id = 12
                method = "tools/call"
                params = @{
                  name = "project_address_delete"
                  arguments = @{ _path = @{ name = $addressName }; mutation_permission = $true }
                }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($deleteAddress)
              $mcp.StandardInput.Flush()
              $deleteAddressResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if ($deleteAddressResponse.id -ne 12 -or -not $deleteAddressResponse.result.structuredContent.result.ok) {
                throw "$label failed to clean the project address"
              }

              $deleteNote = @{
                jsonrpc = "2.0"
                id = 13
                method = "tools/call"
                params = @{
                  name = "project_note_delete"
                  arguments = @{ _path = @{ id = $noteId }; mutation_permission = $true }
                }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($deleteNote)
              $mcp.StandardInput.Flush()
              $deleteNoteResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if ($deleteNoteResponse.id -ne 13 -or -not $deleteNoteResponse.result.structuredContent.result.ok) {
                throw "$label failed to clean the project note"
              }
              $patchWrite = @{
                jsonrpc = "2.0"
                id = 14
                method = "tools/call"
                params = @{
                  name = "patch_write"
                  arguments = @{
                    address = [string]$fixture.u32
                    bytes = "78563412"
                    label = "portable patch e2e"
                    mutation_permission = $true
                  }
                }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($patchWrite)
              $mcp.StandardInput.Flush()
              $patchWriteResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $patchId = [int]$patchWriteResponse.result.structuredContent.result.id
              if ($patchWriteResponse.id -ne 14 -or $patchId -le 0) {
                throw "$label patch_write did not create a tracked patch"
              }

              $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":15,"method":"tools/call","params":{"name":"patch_list","arguments":{}}}')
              $mcp.StandardInput.Flush()
              $patchListResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $activePatch = @($patchListResponse.result.structuredContent.result.patches | Where-Object { [int]$_.id -eq $patchId })
              if ($patchListResponse.id -ne 15 -or $activePatch.Count -ne 1 -or $activePatch[0].new_bytes -ne "78563412") {
                throw "$label patch_list did not expose the tracked patch"
              }

              $patchedRead = @{
                jsonrpc = "2.0"
                id = 16
                method = "tools/call"
                params = @{ name = "memory_read"; arguments = @{ address = [string]$fixture.u32; type = "u32" } }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($patchedRead)
              $mcp.StandardInput.Flush()
              $patchedReadResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if ($patchedReadResponse.id -ne 16 -or [uint64]$patchedReadResponse.result.structuredContent.result.value -ne [uint64]305419896) {
                throw "$label patch bytes were not visible through memory_read"
              }

              $patchRevert = @{
                jsonrpc = "2.0"
                id = 17
                method = "tools/call"
                params = @{ name = "patch_revert"; arguments = @{ _path = @{ id = $patchId }; mutation_permission = $true } }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($patchRevert)
              $mcp.StandardInput.Flush()
              $patchRevertResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if ($patchRevertResponse.id -ne 17 -or -not $patchRevertResponse.result.structuredContent.result.ok) {
                throw "$label failed to revert the tracked patch"
              }

              $restoredRead = @{
                jsonrpc = "2.0"
                id = 18
                method = "tools/call"
                params = @{ name = "memory_read"; arguments = @{ address = [string]$fixture.u32; type = "u32" } }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($restoredRead)
              $mcp.StandardInput.Flush()
              $restoredReadResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if ($restoredReadResponse.id -ne 18 -or [uint64]$restoredReadResponse.result.structuredContent.result.value -ne [uint64]3735928559) {
                throw "$label patch revert did not restore the original bytes"
              }
              $snapshotCreateA = @{
                jsonrpc = "2.0"
                id = 19
                method = "tools/call"
                params = @{
                  name = "snapshot_create"
                  arguments = @{ ranges = @(@{ address = [string]$fixture.u32; size = 4 }); label = "before-change" }
                }
              } | ConvertTo-Json -Depth 10 -Compress
              $mcp.StandardInput.WriteLine($snapshotCreateA)
              $mcp.StandardInput.Flush()
              $snapshotCreateAResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $snapshotA = [int]$snapshotCreateAResponse.result.structuredContent.result.id
              if ($snapshotCreateAResponse.id -ne 19 -or $snapshotA -le 0) {
                throw "$label failed to create the first snapshot"
              }

              $snapshotMutation = @{
                jsonrpc = "2.0"
                id = 20
                method = "tools/call"
                params = @{ name = "memory_write"; arguments = @{ address = [string]$fixture.u32; type = "u32"; value = 3405691582; mutation_permission = $true } }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($snapshotMutation)
              $mcp.StandardInput.Flush()
              $snapshotMutationResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if ($snapshotMutationResponse.id -ne 20 -or -not $snapshotMutationResponse.result.structuredContent.result.ok) {
                throw "$label failed to mutate memory between snapshots"
              }

              $snapshotCreateB = @{
                jsonrpc = "2.0"
                id = 21
                method = "tools/call"
                params = @{
                  name = "snapshot_create"
                  arguments = @{ ranges = @(@{ address = [string]$fixture.u32; size = 4 }); label = "after-change" }
                }
              } | ConvertTo-Json -Depth 10 -Compress
              $mcp.StandardInput.WriteLine($snapshotCreateB)
              $mcp.StandardInput.Flush()
              $snapshotCreateBResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $snapshotB = [int]$snapshotCreateBResponse.result.structuredContent.result.id
              if ($snapshotCreateBResponse.id -ne 21 -or $snapshotB -le $snapshotA) {
                throw "$label failed to create the second snapshot"
              }

              $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":22,"method":"tools/call","params":{"name":"snapshot_list","arguments":{}}}')
              $mcp.StandardInput.Flush()
              $snapshotListResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $snapshotIds = @($snapshotListResponse.result.structuredContent.result.snapshots | ForEach-Object { [int]$_.id })
              if ($snapshotListResponse.id -ne 22 -or -not ($snapshotIds -contains $snapshotA) -or -not ($snapshotIds -contains $snapshotB)) {
                throw "$label snapshot_list is missing captured checkpoints"
              }

              $snapshotDiff = @{
                jsonrpc = "2.0"
                id = 23
                method = "tools/call"
                params = @{ name = "snapshot_diff"; arguments = @{ from = $snapshotA; to = $snapshotB } }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($snapshotDiff)
              $mcp.StandardInput.Flush()
              $snapshotDiffResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              $changes = @($snapshotDiffResponse.result.structuredContent.result.changes)
              if ($snapshotDiffResponse.id -ne 23 -or $changes.Count -lt 1) {
                throw "$label snapshot_diff did not observe the memory transition"
              }

              $snapshotRewind = @{
                jsonrpc = "2.0"
                id = 24
                method = "tools/call"
                params = @{ name = "snapshot_rewind"; arguments = @{ _path = @{ id = $snapshotA }; mutation_permission = $true } }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($snapshotRewind)
              $mcp.StandardInput.Flush()
              $snapshotRewindResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if ($snapshotRewindResponse.id -ne 24 -or -not $snapshotRewindResponse.result.structuredContent.result.ok) {
                throw "$label snapshot rewind failed"
              }

              $snapshotRead = @{
                jsonrpc = "2.0"
                id = 25
                method = "tools/call"
                params = @{ name = "memory_read"; arguments = @{ address = [string]$fixture.u32; type = "u32" } }
              } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($snapshotRead)
              $mcp.StandardInput.Flush()
              $snapshotReadResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
              if ($snapshotReadResponse.id -ne 25 -or [uint64]$snapshotReadResponse.result.structuredContent.result.value -ne [uint64]3735928559) {
                throw "$label snapshot rewind did not restore the captured value"
              }

              foreach ($snapshotId in @($snapshotA, $snapshotB)) {
                $snapshotDelete = @{
                  jsonrpc = "2.0"
                  id = 26 + $snapshotId
                  method = "tools/call"
                  params = @{ name = "snapshot_delete"; arguments = @{ _path = @{ id = $snapshotId }; mutation_permission = $true } }
                } | ConvertTo-Json -Depth 8 -Compress
                $mcp.StandardInput.WriteLine($snapshotDelete)
                $mcp.StandardInput.Flush()
                $snapshotDeleteResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
                if (-not $snapshotDeleteResponse.result.structuredContent.result.ok) {
                  throw "$label failed to delete snapshot $snapshotId"
                }
              }
              $mcp.StandardInput.Close()
              if (-not $mcp.WaitForExit(15000)) {
                $mcp.Kill($true)
                throw "$label MCP process did not exit after stdin closed"
              }
              if ($mcp.ExitCode -ne 0) {
                throw "$label MCP exited with $($mcp.ExitCode): $($mcp.StandardError.ReadToEnd())"
              }
              Write-Host "$label integrated MCP E2E passed"
            } finally {
              if ($mcpStarted -and $mcp -and -not $mcp.HasExited) { $mcp.Kill($true) }
              if ($target -and -not $target.HasExited) { Stop-Process -Id $target.Id -Force -ErrorAction SilentlyContinue }
              Start-Sleep -Milliseconds 250
            }
          }

          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Test-CortexMcp $x64Target (Join-Path $preview "runtime\x64") "x64 target"
            Test-CortexMcp $x86Target (Join-Path $preview "runtime\x86") "x86 target"
          } finally {
            $env:PATH = $oldPath
          }

      - name: Portable GUI smoke test with clean PATH
        shell: pwsh
        run: |
          $preview = (Resolve-Path "staging/x64/CortexPreview").Path
          $oldPath = $env:PATH
          $stdout = Join-Path $env:RUNNER_TEMP "cortex-portable-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "cortex-portable-stderr.txt"
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
            $process = Start-Process `
              -FilePath (Join-Path $preview "cortex.exe") `
              -ArgumentList "--smoke-test" `
              -WorkingDirectory $preview `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -PassThru

            if (-not $process.WaitForExit(15000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Portable Cortex GUI smoke test timed out"
            }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            $startupLog = Join-Path $preview "cortex-smoke.log"
            if (Test-Path $startupLog) { Get-Content $startupLog }
            if ($process.ExitCode -ne 0) {
              throw "Portable Cortex GUI smoke test failed with exit code $($process.ExitCode)"
            }
          } finally {
            $env:PATH = $oldPath
          }

      - name: Upload testable application
        uses: actions/upload-artifact@v4
        with:
          name: cortex-unified-ui-preview-windows
          path: staging/x64/CortexPreview
          if-no-files-found: error
          retention-days: 14

              $readHwValue = @{ jsonrpc="2.0"; id=411; method="tools/call"; params=@{ name="memory_read"; arguments=@{ address=[string]$fixture.hw_value; type="u32" } } } | ConvertTo-Json -Depth 8 -Compress
              $mcp.StandardInput.WriteLine($readHwValue); $mcp.StandardInput.Flush()

name: Unified Cortex UI Preview

on:
  push:
    branches:
      - next/unified-cortex-ui
    paths:
      - "app/**"
      - "core/**"
      - "CMakeLists.txt"
      - ".github/workflows/ui-preview.yml"
  workflow_dispatch:

concurrency:
  group: unified-cortex-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-x64-preview:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW + Qt 6
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-declarative
            mingw-w64-x86_64-qt6-tools

      - name: Configure Cortex application preview
        shell: msys2 {0}
        run: cmake -S app -B build/ui -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build cortex.exe
        shell: msys2 {0}
        run: cmake --build build/ui --parallel 2

      - name: Configure x64 target payload
        shell: msys2 {0}
        run: >-
          cmake -S . -B build/runtime-x64 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF

      - name: Build x64 target payload and E2E target
        shell: msys2 {0}
        run: cmake --build build/runtime-x64 --target core cortex_test_target --parallel 2

      - name: QML smoke test
        shell: msys2 {0}
        run: QT_QPA_PLATFORM=offscreen build/ui/cortex.exe --smoke-test

      - name: Create portable preview directory
        shell: msys2 {0}
        run: |
          set -euo pipefail
          rm -rf dist/CortexPreview
          mkdir -p dist/CortexPreview
          cp build/ui/cortex.exe dist/CortexPreview/cortex.exe
          cp build/runtime-x64/cortex_core.dll dist/CortexPreview/cortex_core.dll

          if command -v windeployqt6 >/dev/null 2>&1; then
            DEPLOY=windeployqt6
          else
            DEPLOY=windeployqt
          fi
          "$DEPLOY" --release --qmldir app/qml --no-translations dist/CortexPreview/cortex.exe

          for pass in 1 2 3 4 5 6 7 8; do
            copied=0
            while IFS= read -r -d '' pe; do
              while IFS= read -r dep; do
                [ -n "$dep" ] || continue
                base="$(basename "$dep")"
                if [ ! -f "dist/CortexPreview/$base" ]; then
                  cp "$dep" "dist/CortexPreview/$base"
                  echo "Bundled runtime dependency: $base"
                  copied=1
                fi
              done < <(ldd "$pe" 2>/dev/null | awk '/=> \/mingw64\/bin\// {print $3} /^\/mingw64\/bin\// {print $1}' | sort -u)
            done < <(find dist/CortexPreview -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
            [ "$copied" -eq 1 ] || break
          done

          printf '%s\n' \
            'Cortex unified application preview' \
            'Branch: next/unified-cortex-ui' \
            'This is a test artifact, not a public release.' \
            'cortex.exe contains the UI/services and loads cortex_core.dll internally only for in-process capabilities.' \
            'Native MCP is integrated: cortex.exe mcp --pid <pid> or --process <name>.' \
            'The bundled payload currently supports x64 targets; x86 bootstrap is added separately.' \
            > dist/CortexPreview/TESTING.txt

      - name: Verify portable runtime dependencies
        shell: msys2 {0}
        run: |
          set -euo pipefail
          test -f dist/CortexPreview/cortex.exe
          test -f dist/CortexPreview/cortex_core.dll
          missing=0
          while IFS= read -r -d '' pe; do
            unresolved="$(ldd "$pe" 2>/dev/null | awk '/not found/ {print}' || true)"
            if [ -n "$unresolved" ]; then
              echo "Unresolved dependencies for $pe:"
              echo "$unresolved"
              missing=1
            fi
          done < <(find dist/CortexPreview -type f \( -iname '*.exe' -o -iname '*.dll' \) -print0)
          [ "$missing" -eq 0 ]

      - name: Integrated Cortex MCP stdio E2E
        shell: pwsh
        run: |
          $preview = (Resolve-Path "dist/CortexPreview").Path
          $targetPath = (Resolve-Path "build/runtime-x64/cortex_test_target_x64.exe").Path
          $oldPath = $env:PATH
          $target = $null
          $mcp = $null

          function Read-McpLine([System.IO.StreamReader]$reader, [int]$timeoutMs = 15000) {
            $task = $reader.ReadLineAsync()
            if (-not $task.Wait($timeoutMs)) {
              throw "Timed out waiting for Cortex MCP stdout"
            }
            if ($null -eq $task.Result) {
              throw "Cortex MCP stdout closed unexpectedly"
            }
            return $task.Result
          }

          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Remove-Item (Join-Path $preview "cortex.token") -Force -ErrorAction SilentlyContinue

            $target = Start-Process -FilePath $targetPath -PassThru
            Start-Sleep -Milliseconds 500

            $start = [System.Diagnostics.ProcessStartInfo]::new()
            $start.FileName = Join-Path $preview "cortex.exe"
            $start.Arguments = "mcp --pid $($target.Id) --tools all"
            $start.WorkingDirectory = $preview
            $start.UseShellExecute = $false
            $start.RedirectStandardInput = $true
            $start.RedirectStandardOutput = $true
            $start.RedirectStandardError = $true
            $start.CreateNoWindow = $true

            $mcp = [System.Diagnostics.Process]::new()
            $mcp.StartInfo = $start
            if (-not $mcp.Start()) { throw "Failed to start integrated Cortex MCP mode" }

            $initialize = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"preview-ci","version":"1"}}}'
            $mcp.StandardInput.WriteLine($initialize)
            $mcp.StandardInput.Flush()
            $initResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
            if ($initResponse.id -ne 1 -or $initResponse.result.protocolVersion -ne "2025-11-25") {
              throw "Integrated MCP legacy protocol negotiation failed"
            }

            $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","method":"notifications/initialized"}')
            $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}')
            $mcp.StandardInput.Flush()
            $toolsResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
            if ($toolsResponse.id -ne 2 -or -not ($toolsResponse.result.tools.name -contains "debug_breakpoint_add")) {
              throw "Integrated MCP --tools all catalog is incomplete"
            }

            $mcp.StandardInput.WriteLine('{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"status","arguments":{}}}')
            $mcp.StandardInput.Flush()
            $statusResponse = (Read-McpLine $mcp.StandardOutput) | ConvertFrom-Json
            $reportedPid = [int64]$statusResponse.result.structuredContent.result.pid
            if ($statusResponse.id -ne 3 -or $reportedPid -ne [int64]$target.Id) {
              throw "Integrated MCP status did not resolve the selected target PID"
            }

            $mcp.StandardInput.Close()
            if (-not $mcp.WaitForExit(15000)) {
              $mcp.Kill($true)
              throw "Integrated Cortex MCP mode did not exit after stdin closed"
            }
            if ($mcp.ExitCode -ne 0) {
              $stderr = $mcp.StandardError.ReadToEnd()
              throw "Integrated Cortex MCP exited with $($mcp.ExitCode): $stderr"
            }
          } finally {
            if ($mcp -and -not $mcp.HasExited) { $mcp.Kill($true) }
            if ($target -and -not $target.HasExited) { Stop-Process -Id $target.Id -Force -ErrorAction SilentlyContinue }
            $env:PATH = $oldPath
          }

      - name: Portable smoke test with clean PATH
        shell: pwsh
        run: |
          $preview = (Resolve-Path "dist/CortexPreview").Path
          $oldPath = $env:PATH
          $stdout = Join-Path $env:RUNNER_TEMP "cortex-portable-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "cortex-portable-stderr.txt"
          try {
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            Remove-Item Env:QT_QPA_PLATFORM -ErrorAction SilentlyContinue
            $process = Start-Process `
              -FilePath (Join-Path $preview "cortex.exe") `
              -ArgumentList "--smoke-test" `
              -WorkingDirectory $preview `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -PassThru

            if (-not $process.WaitForExit(15000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Portable Cortex smoke test timed out"
            }
            if (Test-Path $stdout) { Get-Content $stdout }
            if (Test-Path $stderr) { Get-Content $stderr }
            $startupLog = Join-Path $preview "cortex-smoke.log"
            if (Test-Path $startupLog) { Get-Content $startupLog }
            if ($process.ExitCode -ne 0) {
              throw "Portable Cortex smoke test failed with exit code $($process.ExitCode)"
            }
          } finally {
            $env:PATH = $oldPath
          }

      - name: Upload testable application
        uses: actions/upload-artifact@v4
        with:
          name: cortex-unified-ui-preview-windows-x64
          path: dist/CortexPreview
          if-no-files-found: error
          retention-days: 14
